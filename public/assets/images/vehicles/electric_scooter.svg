<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Electric Scooter - modern EV runabout (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="66" r="12.5" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="44" cy="66" r="11.5" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="44" cy="66" r="8" fill="#bdc3c7"/>
    <circle cx="44" cy="66" r="6" fill="#7f8c8d"/>
    <circle cx="44" cy="66" r="3" fill="#2c3e50"/>
    <line x1="44" y1="58.5" x2="44" y2="73.5" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="36" y1="66" x2="52" y2="66" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="114" cy="66" r="12.5" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="114" cy="66" r="11.5" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="114" cy="66" r="8" fill="#bdc3c7"/>
    <circle cx="114" cy="66" r="6" fill="#7f8c8d"/>
    <circle cx="114" cy="66" r="3" fill="#2c3e50"/>
    <line x1="114" y1="58.5" x2="114" y2="73.5" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="106" y1="66" x2="122" y2="66" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FRONT FORK -->
  <line x1="102" y1="38" x2="114" y2="66" stroke="#95a5a6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- HUB-MOTOR HINT (front) -->
  <circle cx="114" cy="66" r="4.5" fill="none" stroke="#00bcd4" stroke-width="1.5"/>

  <!-- REAR BODY (smooth white cowl, battery housing) -->
  <path d="M 28 46 Q 28 32 52 32 L 78 40 L 76 55 L 32 55 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>
  <path d="M 36 38 Q 52 36 66 42" stroke="#00bcd4" stroke-width="2" fill="none"/>

  <!-- CHARGE INDICATOR DOTS -->
  <circle cx="44" cy="48" r="2" fill="#00bcd4"/>
  <circle cx="51" cy="48" r="2" fill="#00bcd4"/>
  <circle cx="58" cy="48" r="2" fill="#bdc3c7"/>

  <!-- FLAT DECK / FLOORBOARD -->
  <rect x="68" y="48" width="28" height="7" rx="3" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>
  <line x1="72" y1="51.5" x2="92" y2="51.5" stroke="#00bcd4" stroke-width="1" opacity="0.7"/>

  <!-- FRONT APRON (clean modern curve) -->
  <path d="M 84 50 L 104 28 Q 110 23 106 19 L 95 24 L 81 46 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>
  <path d="M 88 44 Q 97 31 99 25" stroke="#00bcd4" stroke-width="2" fill="none"/>

  <!-- SEAT (low sleek) -->
  <path d="M 38 30 Q 56 28 74 36 L 72 42 L 36 38 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>

  <!-- HANDLEBAR POD & LED LIGHT BAR -->
  <rect x="95" y="15" width="17" height="9" rx="4" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1"/>
  <rect x="107" y="17" width="5" height="2.5" rx="1.2" fill="#ffffff" stroke="#00bcd4" stroke-width="0.8"/>
  <line x1="99" y1="24" x2="104" y2="19" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- FRONT MUDGUARD -->
  <path d="M 102 48 Q 114 46 119 56 L 107 56 Z" fill="#bdc3c7"/>

  <!-- NO EXHAUST: clean bottom, small stand -->
  <line x1="60" y1="55" x2="56" y2="64" stroke="#566573" stroke-width="2" stroke-linecap="round"/>
</svg>
