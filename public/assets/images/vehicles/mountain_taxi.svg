<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Taxi - rugged Nepal taxi (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="66" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="44" cy="66" r="11.5" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="44" cy="66" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="44" cy="66" r="5.5" fill="#ecf0f1"/>
    <circle cx="44" cy="66" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="66" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="66" r="11.5" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="118" cy="66" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="66" r="5.5" fill="#ecf0f1"/>
    <circle cx="118" cy="66" r="3" fill="#2c3e50"/>
  </g>

  <!-- COMPACT HATCH BODY (dusty cream, worn) -->
  <path d="M 30 44 L 30 26 Q 30 22 34 22 L 70 22 L 82 12 L 108 12 Q 114 12 118 18 L 126 26 L 136 28 Q 144 30 144 38 L 144 54 Q 144 57 140 57 L 30 57 Q 30 57 30 54 Z" fill="#e8e0cd" stroke="#b8ab8d" stroke-width="1.5"/>
  <path d="M 84 14 L 106 14 Q 110 14 113 18 L 120 26 L 82 26 Z" fill="#d9d0b8"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 31 57 A 16 16 0 0 1 59 57 Z" fill="#1b2631"/>
  <path d="M 105 57 A 16 16 0 0 1 131 57 Z" fill="#1b2631"/>

  <!-- WINDOWS -->
  <path d="M 86 16 L 104 16 Q 108 16 111 20 L 116 25 L 86 25 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="36" y="26" width="20" height="11" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="60" y="26" width="18" height="11" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- TAXI CHECK STRIPE (geometric squares) -->
  <rect x="30" y="40" width="114" height="4" fill="#2c3e50"/>
  <rect x="34" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="46" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="58" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="70" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="82" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="94" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="106" y="40" width="4" height="4" fill="#f1c40f"/>
  <rect x="118" y="40" width="4" height="4" fill="#f1c40f"/>

  <!-- ROOF TAXI SIGN (blank box) -->
  <rect x="88" y="5" width="18" height="7" rx="1.5" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>

  <!-- ROOF RACK + LUGGAGE -->
  <line x1="40" y1="20" x2="80" y2="20" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="48" y="15" width="14" height="5" rx="1" fill="#8d6e63"/>
  <rect x="66" y="16" width="10" height="4" rx="1" fill="#a1887f"/>

  <!-- WEAR PATCHES (rural roads) -->
  <rect x="32" y="48" width="12" height="4" rx="1" fill="#cfc4a8"/>
  <rect x="96" y="48" width="16" height="4" rx="1" fill="#cfc4a8"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="141" cy="45" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="132" y="53" width="15" height="4" rx="1.5" fill="#566573"/>
</svg>
