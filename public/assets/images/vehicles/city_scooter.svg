<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Nepali City Scooter Body & Wheels (Side View, facing right) -->
  
  <!-- REAR SCOOTER WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="66" r="13" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="44" cy="66" r="12" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="44" cy="66" r="8.5" fill="#bdc3c7"/>
    <circle cx="44" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="44" cy="66" r="3" fill="#2c3e50"/>
    <line x1="44" y1="57.5" x2="44" y2="74.5" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="35.5" y1="66" x2="52.5" y2="66" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FRONT SCOOTER WHEEL -->
  <g id="front-wheel">
    <circle cx="114" cy="66" r="13" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="114" cy="66" r="12" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="114" cy="66" r="8.5" fill="#bdc3c7"/>
    <circle cx="114" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="114" cy="66" r="3" fill="#2c3e50"/>
    <line x1="114" y1="57.5" x2="114" y2="74.5" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="105.5" y1="66" x2="122.5" y2="66" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FRONT FORK -->
  <line x1="102" y1="36" x2="114" y2="66" stroke="#7f8c8d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- REAR BODY COWL (Vibrant Red) -->
  <path d="M 28 46 Q 28 30 54 30 L 80 38 L 78 55 L 34 55 Z" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
  <path d="M 38 36 Q 54 34 68 40" stroke="#f1948a" stroke-width="2" fill="none"/>
  
  <!-- REAR WHEEL ARCH CUTOUT -->
  <path d="M 30 55 A 15 15 0 0 1 58 55 Z" fill="#2c3e50" opacity="0.3"/>

  <!-- FLOORBOARD -->
  <rect x="70" y="48" width="26" height="7" rx="2" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>

  <!-- FRONT APRON / SHIELD -->
  <path d="M 85 50 L 106 28 Q 112 24 108 20 L 96 24 L 82 46 Z" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
  <path d="M 88 44 Q 98 30 100 24" stroke="#f1948a" stroke-width="2" fill="none"/>

  <!-- PLUSH DUAL SEAT -->
  <path d="M 38 28 Q 58 26 76 34 L 74 40 L 36 36 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>
  <line x1="56" y1="28" x2="54" y2="38" stroke="#7f8c8d" stroke-width="1"/>

  <!-- HANDLEBARS & HEADLIGHT COWL -->
  <rect x="96" y="14" width="16" height="10" rx="3" fill="#e74c3c" stroke="#b03a2e" stroke-width="1"/>
  <circle cx="110" cy="19" r="4.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1.5"/>

  <!-- FRONT MUDGUARD -->
  <path d="M 102 48 Q 116 46 120 56 L 108 56 Z" fill="#c0392b"/>

  <!-- REAR RACK & TAILLIGHT -->
  <rect x="22" y="34" width="10" height="3" rx="1" fill="#7f8c8d"/>
  <rect x="23" y="38" width="5" height="6" rx="1" fill="#e74c3c"/>
</svg>
