<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Farm Tractor - agricultural workhorse (Side View, facing right) -->

  <!-- LARGE REAR WHEEL (agricultural lug tread) -->
  <g id="rear-wheel">
    <circle cx="40" cy="62" r="21" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <circle cx="40" cy="62" r="19" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="40" cy="62" r="13" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
    <circle cx="40" cy="62" r="8.5" fill="#7f8c8d"/>
    <circle cx="40" cy="62" r="4" fill="#2c3e50"/>
    <path d="M 40 49 L 40 75 M 27 62 L 53 62 M 31 53 L 49 71 M 31 71 L 49 53" stroke="#d5dbdb" stroke-width="1.5"/>
  </g>

  <!-- SMALLER FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="120" cy="68" r="11" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="120" cy="68" r="10" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="120" cy="68" r="6.5" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
    <circle cx="120" cy="68" r="4" fill="#7f8c8d"/>
    <circle cx="120" cy="68" r="2.2" fill="#2c3e50"/>
    <path d="M 120 61 L 120 75 M 113.5 68 L 126.5 68" stroke="#d5dbdb" stroke-width="1"/>
  </g>

  <!-- CHASSIS FRAME -->
  <rect x="26" y="52" width="102" height="9" rx="2" fill="#2c3e50"/>

  <!-- FRONT ENGINE HOOD (John-Deere green, angled nose) -->
  <path d="M 74 52 L 76 28 L 126 28 Q 132 28 133 36 L 134 52 Z" fill="#2e8b57" stroke="#1e8449" stroke-width="1.5"/>
  <path d="M 80 32 L 128 32 L 128 39 L 80 39 Z" fill="#1e8449"/>
  <line x1="86" y1="42" x2="130" y2="42" stroke="#1e8449" stroke-width="1"/>

  <!-- ROLL-BAR CANOPY (flat roof + posts, distinct from open rural tractor) -->
  <rect x="46" y="12" width="52" height="4.5" rx="2" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <line x1="52" y1="16.5" x2="52" y2="38" stroke="#d4ac0d" stroke-width="2.5"/>
  <line x1="92" y1="16.5" x2="94" y2="30" stroke="#d4ac0d" stroke-width="2.5"/>

  <!-- DRIVER SEAT UNDER CANOPY -->
  <path d="M 52 36 L 66 36 L 64 45 L 50 45 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
  <line x1="68" y1="38" x2="60" y2="28" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- VERTICAL EXHAUST STACK -->
  <rect x="112" y="12" width="4" height="16" fill="#7f8c8d" stroke="#34495e" stroke-width="0.5"/>
  <path d="M 110 12 L 118 10 L 114 12 Z" fill="#2c3e50"/>

  <!-- REAR TOOLBOX / FENDER HINT -->
  <rect x="22" y="44" width="14" height="8" rx="1.5" fill="#1e8449" stroke="#145a32" stroke-width="1"/>

  <!-- HEADLIGHT + GRILLE -->
  <circle cx="131" cy="34" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="128" y="42" width="5" height="9" fill="#7f8c8d"/>
</svg>
