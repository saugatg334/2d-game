<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Kathmandu Taxi - city taxi sedan (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="67" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="44" cy="67" r="11.5" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="44" cy="67" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="44" cy="67" r="5.5" fill="#ecf0f1"/>
    <circle cx="44" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="67" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="67" r="11.5" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="118" cy="67" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="67" r="5.5" fill="#ecf0f1"/>
    <circle cx="118" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- COMPACT THREE-BOX SEDAN BODY (clean white) -->
  <path d="M 22 55 Q 22 44 32 40 L 44 36 Q 52 27 68 26 L 86 26 Q 100 27 108 34 L 122 37 Q 140 41 144 48 Q 146 52 144 55 Z"
        fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>

  <!-- CABIN WINDOWS -->
  <path d="M 50 35 Q 58 29 70 28 L 84 28 Q 96 29 102 35 L 96 39 Q 86 34 72 34 Q 60 34 54 39 Z"
        fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="76" y1="36" x2="76" y2="54" stroke="#bdc3c7" stroke-width="1"/>
  <rect x="80" y="44" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- TAXI ROOF SIGN (blank yellow box, dark border) -->
  <rect x="72" y="17" width="18" height="7" rx="1.5" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <line x1="76" y1="20.5" x2="86" y2="20.5" stroke="#b7950b" stroke-width="1"/>

  <!-- BLACK TAXI BELTLINE TRIM -->
  <rect x="24" y="47" width="118" height="3.5" fill="#2c3e50"/>

  <!-- FRONT PLATE HINT (blank dark rect on bumper) -->
  <rect x="138" y="52" width="9" height="4" rx="0.8" fill="#2c3e50"/>

  <!-- HEADLIGHT -->
  <circle cx="139" cy="46" r="2.6" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- WHEEL ARCHES -->
  <path d="M 31 55 A 16 16 0 0 1 57 55 Z" fill="#1b2631"/>
  <path d="M 105 55 A 16 16 0 0 1 131 55 Z" fill="#1b2631"/>
</svg>
