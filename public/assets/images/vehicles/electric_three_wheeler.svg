<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Electric Three Wheeler - open utility electric rickshaw (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="38" cy="69" r="10" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="38" cy="69" r="7.5" fill="#bdc3c7"/>
    <circle cx="38" cy="69" r="3" fill="#2c3e50"/>
    <circle cx="38" cy="69" r="8.5" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- SMALL FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="126" cy="71" r="8.5" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="126" cy="71" r="6" fill="#bdc3c7"/>
    <circle cx="126" cy="71" r="2.5" fill="#2c3e50"/>
    <circle cx="126" cy="71" r="3.5" fill="none" stroke="#00bcd4" stroke-width="1.2"/>
  </g>

  <!-- OPEN UTILITY FRAME (no canopy) -->
  <path d="M 20 62 L 20 44 L 28 44 L 28 62 Z" fill="#1abc9c" stroke="#148f77" stroke-width="1.2"/>
  <path d="M 88 62 L 88 40 L 112 40 L 112 62 Z" fill="#1abc9c" stroke="#148f77" stroke-width="1.2"/>

  <!-- FLAT CARGO DECK + SIDE RAIL -->
  <rect x="20" y="58" width="92" height="5" rx="1.5" fill="#148f77"/>
  <rect x="30" y="50" width="52" height="8" rx="1" fill="#76d7c4" stroke="#148f77" stroke-width="1"/>
  <line x1="44" y1="50" x2="44" y2="58" stroke="#148f77" stroke-width="1"/>
  <line x1="58" y1="50" x2="58" y2="58" stroke="#148f77" stroke-width="1"/>
  <line x1="72" y1="50" x2="72" y2="58" stroke="#148f77" stroke-width="1"/>

  <!-- DRIVER SEAT -->
  <rect x="90" y="32" width="16" height="8" rx="2" fill="#2c3e50"/>
  <rect x="92" y="40" width="12" height="4" rx="1" fill="#2c3e50"/>

  <!-- BATTERY BOX UNDER DECK -->
  <rect x="44" y="63" width="40" height="6" rx="1.5" fill="#2c3e50"/>
  <line x1="50" y1="66" x2="78" y2="66" stroke="#00bcd4" stroke-width="1.2" opacity="0.85"/>
  <circle cx="64" cy="66" r="1.8" fill="#00bcd4"/>

  <!-- TILLER + FRONT FORK -->
  <line x1="112" y1="34" x2="122" y2="44" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <line x1="116" y1="42" x2="126" y2="71" stroke="#95a5a6" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="110" y="30" width="10" height="5" rx="2" fill="#2c3e50"/>

  <!-- HEADLIGHT POD ON FRONT FRAME -->
  <circle cx="114" cy="52" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- REAR RACK POSTS -->
  <line x1="22" y1="44" x2="22" y2="58" stroke="#148f77" stroke-width="2"/>
  <line x1="26" y1="44" x2="26" y2="58" stroke="#148f77" stroke-width="2"/>
</svg>
