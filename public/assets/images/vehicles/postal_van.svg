<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Postal Van - tall two-box delivery/postal van (Side View, facing right) -->

  <!-- REAR WHEEL (small) -->
  <g id="rear-wheel">
    <circle cx="46" cy="69" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="46" cy="69" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="46" cy="69" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="46" cy="69" r="5.5" fill="#ecf0f1"/>
    <circle cx="46" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (small) -->
  <g id="front-wheel">
    <circle cx="118" cy="69" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="69" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="118" cy="69" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="69" r="5.5" fill="#ecf0f1"/>
    <circle cx="118" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- TALL REAR CARGO BOX (cream) -->
  <rect x="22" y="18" width="76" height="39" fill="#f5e9d3" stroke="#c9b28a" stroke-width="1.5"/>
  <!-- POSTAL RED LOWER BAND -->
  <rect x="22" y="49" width="116" height="6" fill="#c0392b"/>

  <!-- SLIDING SIDE DOOR (rail + seam) -->
  <line x1="66" y1="19" x2="66" y2="56" stroke="#c9b28a" stroke-width="1.3"/>
  <rect x="70" y="25" width="18" height="16" rx="1" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <line x1="68" y1="52" x2="88" y2="52" stroke="#c9b28a" stroke-width="1.5"/>
  <rect x="72" y="44" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- REAR SIDE WINDOW -->
  <rect x="28" y="25" width="14" height="16" rx="1" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- CAB (front, sloped) -->
  <path d="M 98 30 L 116 30 Q 128 30 135 38 L 141 46 Q 143 49 143 53 L 143 57 L 98 57 Z" fill="#f5e9d3" stroke="#c9b28a" stroke-width="1.5"/>
  <path d="M 104 34 L 118 34 Q 126 35 131 41 L 134 46 L 104 46 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- WHEEL ARCHES -->
  <path d="M 33 57 A 16 16 0 0 1 61 57 Z" fill="#1b2631"/>
  <path d="M 105 57 A 16 16 0 0 1 133 57 Z" fill="#1b2631"/>

  <!-- ROOF MARKER + MIRROR -->
  <rect x="50" y="14" width="18" height="4" rx="1.5" fill="#c0392b"/>
  <line x1="120" y1="32" x2="116" y2="26" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="112" y="23" width="5" height="4" rx="1" fill="#2c3e50"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="139" cy="50" r="2.8" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="133" y="55" width="16" height="4" rx="1.5" fill="#566573"/>
</svg>
