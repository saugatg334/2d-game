<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Offroad Jeep - open trail machine (Side View, facing right) -->

  <!-- LARGE OFF-ROAD TIRES -->
  <g id="rear-wheel">
    <circle cx="40" cy="64" r="16" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="64" r="14" fill="none" stroke="#444444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="40" cy="64" r="9.5" fill="#bdc3c7"/>
    <circle cx="40" cy="64" r="6.5" fill="#7f8c8d"/>
    <circle cx="40" cy="64" r="3" fill="#2c3e50"/>
    <line x1="40" y1="54" x2="40" y2="74" stroke="#95a5a6" stroke-width="1.2"/>
    <line x1="30" y1="64" x2="50" y2="64" stroke="#95a5a6" stroke-width="1.2"/>
  </g>
  <g id="front-wheel">
    <circle cx="122" cy="64" r="16" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="122" cy="64" r="14" fill="none" stroke="#444444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="122" cy="64" r="9.5" fill="#bdc3c7"/>
    <circle cx="122" cy="64" r="6.5" fill="#7f8c8d"/>
    <circle cx="122" cy="64" r="3" fill="#2c3e50"/>
    <line x1="122" y1="54" x2="122" y2="74" stroke="#95a5a6" stroke-width="1.2"/>
    <line x1="112" y1="64" x2="132" y2="64" stroke="#95a5a6" stroke-width="1.2"/>
  </g>

  <!-- HIGH GROUND-CLEARANCE CHASSIS -->
  <rect x="20" y="48" width="124" height="8" rx="2" fill="#1b2631"/>

  <!-- OPEN TUB BODY (olive drab, no roof) -->
  <path d="M 24 48 L 24 30 L 96 30 L 96 24 L 130 24 Q 144 24 148 34 L 150 44 Q 150 48 146 48 Z" fill="#6b8e23" stroke="#4a5d17" stroke-width="1.5"/>

  <!-- ROLL BAR HOOP -->
  <path d="M 34 30 L 34 12 L 66 12 L 66 30" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <line x1="34" y1="21" x2="66" y2="21" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- WINDSHIELD FRAME (folded forward) -->
  <line x1="98" y1="24" x2="104" y2="38" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round"/>

  <!-- SEATS (open cabin) -->
  <path d="M 44 30 L 54 30 L 52 40 L 42 40 Z" fill="#5d4037"/>
  <path d="M 62 30 L 72 30 L 70 40 L 60 40 Z" fill="#5d4037"/>

  <!-- HOOD + HEADLIGHT -->
  <path d="M 100 30 L 128 30 L 130 38 L 100 38 Z" fill="#5d7a1a"/>
  <circle cx="144" cy="38" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- STRONG FRONT BUMPER + WINCH HINT -->
  <rect x="142" y="42" width="9" height="7" rx="1.5" fill="#566573"/>
  <circle cx="146" cy="45.5" r="2" fill="#2c3e50"/>

  <!-- REAR JERRY CAN -->
  <rect x="12" y="36" width="10" height="12" rx="1.5" fill="#d35400" stroke="#7b241c" stroke-width="1"/>

  <!-- SIDE EXHAUST SNORKEL -->
  <rect x="88" y="10" width="4" height="14" fill="#7f8c8d"/>
  <rect x="85" y="8" width="10" height="4" rx="1.5" fill="#2c3e50"/>
</svg>
