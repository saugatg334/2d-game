<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Rural Three Wheeler - Nepal tempo classic (Side View, facing right) -->

  <!-- TWIN REAR WHEELS (three-wheel silhouette) -->
  <g id="rear-wheel-outer">
    <circle cx="34" cy="66" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="34" cy="66" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="34" cy="66" r="8" fill="#bdc3c7"/>
    <circle cx="34" cy="66" r="5" fill="#7f8c8d"/>
    <circle cx="34" cy="66" r="2.5" fill="#2c3e50"/>
  </g>
  <g id="rear-wheel-inner">
    <circle cx="50" cy="66" r="11" fill="#1a1a1a" stroke="#000000" stroke-width="1.5" opacity="0.92"/>
    <circle cx="50" cy="66" r="7" fill="#bdc3c7"/>
    <circle cx="50" cy="66" r="3" fill="#2c3e50"/>
  </g>

  <!-- SMALL FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="120" cy="68" r="9" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="120" cy="68" r="8" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="120" cy="68" r="5.5" fill="#bdc3c7"/>
    <circle cx="120" cy="68" r="3" fill="#7f8c8d"/>
    <circle cx="120" cy="68" r="1.5" fill="#2c3e50"/>
  </g>

  <!-- FRONT FORK (scooter-style) -->
  <line x1="108" y1="40" x2="120" y2="68" stroke="#7f8c8d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- LOWER CHASSIS -->
  <rect x="26" y="54" width="96" height="6" rx="2" fill="#1b2631"/>

  <!-- REAR PASSENGER BOX (mustard yellow) -->
  <path d="M 24 24 L 84 24 L 84 54 L 24 54 Z" fill="#d4a017" stroke="#a87e0e" stroke-width="1.5"/>
  <rect x="30" y="30" width="22" height="12" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="56" y="30" width="22" height="12" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="24" y="46" width="60" height="3.5" fill="#a87e0e"/>

  <!-- CANOPY ROOF + POSTS -->
  <rect x="20" y="14" width="70" height="4.5" rx="2" fill="#16a085" stroke="#0e6655" stroke-width="1"/>
  <line x1="28" y1="18.5" x2="28" y2="24" stroke="#0e6655" stroke-width="2.5"/>
  <line x1="82" y1="18.5" x2="82" y2="24" stroke="#0e6655" stroke-width="2.5"/>

  <!-- DRIVER CAB (front, open) -->
  <path d="M 84 54 L 84 26 L 100 26 L 106 34 L 112 40 L 112 54 Z" fill="#16a085" stroke="#0e6655" stroke-width="1.5"/>
  <path d="M 88 30 L 98 30 L 103 38 L 88 38 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- HANDLEBAR -->
  <line x1="104" y1="36" x2="110" y2="24" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>

  <!-- HEADLIGHT (front nose) -->
  <circle cx="110" cy="46" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- REAR LADDER RACK -->
  <line x1="18" y1="24" x2="18" y2="52" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="18" y1="30" x2="24" y2="30" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="18" y1="40" x2="24" y2="40" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- MUDGUARD OVER FRONT WHEEL -->
  <path d="M 110 56 Q 120 52 128 60 L 116 58 Z" fill="#0e6655"/>
</svg>
