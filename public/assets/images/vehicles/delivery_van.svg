<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Delivery Van - compact urban courier (Side View, facing right) -->

  <!-- REAR WHEEL (small) -->
  <g id="rear-wheel">
    <circle cx="46" cy="68" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="46" cy="68" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="46" cy="68" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="46" cy="68" r="5.5" fill="#ecf0f1"/>
    <circle cx="46" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (small) -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="118" cy="68" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="5.5" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- ONE-BOX BODY (compact, warm beige) -->
  <path d="M 30 24 L 96 24 Q 100 24 102 20 L 118 20 Q 130 20 137 30 L 143 40 Q 145 44 145 50 L 145 54 Q 145 57 141 57 L 30 57 Q 26 57 26 53 L 26 28 Q 26 24 30 24 Z" fill="#e8d8c3" stroke="#b8a284" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 33 57 A 16 16 0 0 1 61 57 Z" fill="#1b2631"/>
  <path d="M 105 57 A 16 16 0 0 1 133 57 Z" fill="#1b2631"/>

  <!-- CARGO PANEL (rear box section) -->
  <rect x="30" y="28" width="52" height="26" rx="1.5" fill="#d7c4a7" stroke="#b8a284" stroke-width="1"/>
  <line x1="56" y1="28" x2="56" y2="54" stroke="#b8a284" stroke-width="1.2"/>

  <!-- CAB WINDOW + DOOR WINDOW -->
  <path d="M 116 26 L 130 26 Q 136 27 140 34 L 142 40 L 116 40 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="102" y="27" width="11" height="12" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- SIDE DOOR SEAM + HANDLE -->
  <line x1="98" y1="24" x2="98" y2="56" stroke="#b8a284" stroke-width="1.2"/>
  <rect x="92" y="42" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- DELIVERY STRIPE (courier green) -->
  <rect x="26" y="50" width="119" height="4" fill="#27ae60"/>

  <!-- ROOF RAIL -->
  <line x1="34" y1="20" x2="112" y2="20" stroke="#7f8c8d" stroke-width="2"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="141" cy="46" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="132" y="52" width="16" height="4" rx="1.5" fill="#566573"/>
</svg>
