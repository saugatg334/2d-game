<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Trail Motorcycle - loaded adventure tourer (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="66" r="14" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="42" cy="66" r="12.5" fill="none" stroke="#444444" stroke-width="1.8" stroke-dasharray="3.5,2.5"/>
    <circle cx="42" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="42" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="42" cy="66" r="3" fill="#2c3e50"/>
    <line x1="42" y1="57" x2="42" y2="75" stroke="#95a5a6" stroke-width="1"/>
    <line x1="33" y1="66" x2="51" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="66" r="14" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="118" cy="66" r="12.5" fill="none" stroke="#444444" stroke-width="1.8" stroke-dasharray="3.5,2.5"/>
    <circle cx="118" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="118" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="118" cy="66" r="3" fill="#2c3e50"/>
    <line x1="118" y1="57" x2="118" y2="75" stroke="#95a5a6" stroke-width="1"/>
    <line x1="109" y1="66" x2="127" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- RUGGED SWINGARM & GUARDED FORKS -->
  <line x1="42" y1="66" x2="66" y2="50" stroke="#566573" stroke-width="5" stroke-linecap="round"/>
  <line x1="94" y1="34" x2="118" y2="66" stroke="#566573" stroke-width="5" stroke-linecap="round"/>
  <line x1="97" y1="34" x2="119" y2="64" stroke="#aab7b8" stroke-width="2" stroke-linecap="round"/>
  <rect x="100" y="44" width="7" height="13" rx="2" fill="#5d6d7e" transform="rotate(35 103 50)"/>

  <!-- ENGINE -->
  <rect x="58" y="44" width="22" height="16" rx="3" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="69" cy="52" r="4.5" fill="#95a5a6"/>

  <!-- EXHAUST (low, wide silencer) -->
  <path d="M 68 56 Q 54 58 40 52 L 30 48" stroke="#784212" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <rect x="26" y="44" width="14" height="7" rx="2" fill="#95a5a6" stroke="#5d6d7e" stroke-width="1" transform="rotate(-15 33 47)"/>

  <!-- TRELLIS FRAME -->
  <path d="M 46 48 L 70 44 L 92 36 L 72 34 Z" fill="#2c3e50"/>
  <line x1="52" y1="47" x2="84" y2="38" stroke="#5d6d7e" stroke-width="1.2"/>

  <!-- TANK (trail khaki-green) -->
  <path d="M 66 34 Q 80 24 98 33 L 94 43 L 64 42 Z" fill="#1e8449" stroke="#145a32" stroke-width="1.5"/>
  <path d="M 72 29 Q 82 26 92 32" stroke="#58d68d" stroke-width="1.8" fill="none"/>

  <!-- DUAL SEAT -->
  <path d="M 36 34 Q 52 32 68 39 L 64 45 L 36 40 Z" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>

  <!-- LUGGAGE RACK + PANNIER -->
  <line x1="28" y1="34" x2="44" y2="38" stroke="#566573" stroke-width="3" stroke-linecap="round"/>
  <rect x="24" y="26" width="16" height="10" rx="1.5" fill="#5d6d7e" stroke="#2c3e50" stroke-width="1"/>
  <line x1="28" y1="26" x2="28" y2="36" stroke="#2c3e50" stroke-width="1"/>
  <line x1="34" y1="26" x2="34" y2="36" stroke="#2c3e50" stroke-width="1"/>

  <!-- TOP BOX -->
  <rect x="34" y="20" width="14" height="8" rx="2" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1"/>

  <!-- HIGH FRONT FENDER -->
  <path d="M 96 34 Q 116 34 128 44 L 108 42 Z" fill="#1e8449" stroke="#145a32" stroke-width="1"/>

  <!-- SMALL WINDSCREEN -->
  <path d="M 96 32 Q 108 24 114 14 L 118 16 Q 110 26 102 34 Z" fill="#85c1e9" opacity="0.55" stroke="#5dade2" stroke-width="1"/>

  <!-- HANDLEBARS & LIGHT -->
  <line x1="96" y1="33" x2="104" y2="20" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <rect x="99" y="18" width="12" height="4" rx="1.5" fill="#1e8449"/>
  <circle cx="108" cy="27" r="4.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1.5"/>
</svg>
