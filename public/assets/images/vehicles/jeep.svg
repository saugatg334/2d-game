<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Jeep Body & Wheels (Side View, facing right) -->
  
  <!-- REAR 4x4 OFF-ROAD WHEEL -->
  <g id="rear-wheel">
    <circle cx="45" cy="66" r="17" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <!-- Deep Off-Road Treads -->
    <circle cx="45" cy="66" r="15" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="45" cy="66" r="11" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="45" cy="66" r="8" fill="#7f8c8d"/>
    <circle cx="45" cy="66" r="3.5" fill="#2c3e50"/>
    <!-- 5 Spoke Detail -->
    <path d="M 45 55 L 45 77 M 34 66 L 56 66 M 37 58 L 53 74 M 37 74 L 53 58" stroke="#ecf0f1" stroke-width="1.2"/>
  </g>

  <!-- FRONT 4x4 OFF-ROAD WHEEL -->
  <g id="front-wheel">
    <circle cx="115" cy="66" r="17" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <!-- Deep Off-Road Treads -->
    <circle cx="115" cy="66" r="15" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="115" cy="66" r="11" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="115" cy="66" r="8" fill="#7f8c8d"/>
    <circle cx="115" cy="66" r="3.5" fill="#2c3e50"/>
    <!-- 5 Spoke Detail -->
    <path d="M 115 55 L 115 77 M 104 66 L 126 66 M 107 58 L 123 74 M 107 74 L 123 58" stroke="#ecf0f1" stroke-width="1.2"/>
  </g>

  <!-- CHASSIS BASE & UNDERBODY -->
  <rect x="20" y="48" width="120" height="8" rx="2" fill="#1b2631"/>

  <!-- LOWER BODY SHELL (Mountain Green) -->
  <path d="M 18 50 L 22 34 L 125 34 L 142 40 L 140 50 Z" fill="#1e8449" stroke="#145a32" stroke-width="1.5"/>

  <!-- REAR & FRONT WHEEL ARCH CUTOUTS -->
  <path d="M 26 50 A 20 20 0 0 1 64 50" fill="none" stroke="#145a32" stroke-width="3"/>
  <path d="M 96 50 A 20 20 0 0 1 134 50" fill="none" stroke="#145a32" stroke-width="3"/>

  <!-- FRONT HOOD & NOSE -->
  <path d="M 90 34 L 132 34 L 140 42 L 90 42 Z" fill="#27ae60"/>

  <!-- HEADLIGHT & BUMPER -->
  <circle cx="138" cy="38" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="138" y="44" width="10" height="7" rx="2" fill="#7f8c8d"/>

  <!-- OPEN CAB ROLL CAGE & WINDSHIELD FRAME -->
  <path d="M 45 34 L 45 16 L 92 16 L 102 34 Z" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linejoin="round"/>

  <!-- WINDSHIELD GLASS -->
  <path d="M 86 33 L 94 18 L 100 18 L 90 33 Z" fill="#85c1e9" opacity="0.85"/>

  <!-- CANVAS ROOF TOP -->
  <path d="M 42 15 L 94 15 L 90 20 L 44 20 Z" fill="#d35400"/>

  <!-- DOOR PANEL & EMBLEM -->
  <rect x="52" y="36" width="32" height="14" rx="2" fill="none" stroke="#145a32" stroke-width="1.5"/>
  <path d="M 56 40 L 62 40 L 57 44 L 62 44 L 56 48 Z" fill="#dc7633"/>

  <!-- REAR SPARE TIRE MOUNT -->
  <rect x="12" y="28" width="8" height="20" rx="2" fill="#2c3e50"/>
</svg>
