<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Himalayan Rally Car - mountain rally (Side View, facing right) -->

  <!-- RAISED-SUSPENSION TIRES -->
  <g id="rear-wheel">
    <circle cx="42" cy="66" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="66" r="13.5" fill="none" stroke="#444444" stroke-width="2.2" stroke-dasharray="4,3"/>
    <circle cx="42" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="42" cy="66" r="6" fill="#7f8c8d"/>
    <circle cx="42" cy="66" r="3" fill="#2c3e50"/>
  </g>
  <g id="front-wheel">
    <circle cx="120" cy="66" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="120" cy="66" r="13.5" fill="none" stroke="#444444" stroke-width="2.2" stroke-dasharray="4,3"/>
    <circle cx="120" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="120" cy="66" r="6" fill="#7f8c8d"/>
    <circle cx="120" cy="66" r="3" fill="#2c3e50"/>
  </g>

  <!-- RAISED CHASSIS + SUSPENSION -->
  <rect x="24" y="50" width="118" height="7" rx="2" fill="#1b2631"/>
  <line x1="46" y1="52" x2="52" y2="44" stroke="#566573" stroke-width="2.5"/>
  <line x1="118" y1="52" x2="112" y2="44" stroke="#566573" stroke-width="2.5"/>

  <!-- COMPACT RUGGED RALLY BODY (glacier white-blue) -->
  <path d="M 26 50 L 26 32 L 36 22 L 76 20 L 88 12 L 116 12 Q 124 12 129 18 L 136 26 L 142 30 Q 148 33 148 40 L 148 52 Q 148 55 144 55 L 26 55 Z" fill="#d6eaf8" stroke="#85a3b8" stroke-width="1.5"/>
  <path d="M 90 14 L 114 14 Q 120 14 124 19 L 130 26 L 88 26 Z" fill="#aed6f1"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 26 55 A 19 19 0 0 1 62 55 Z" fill="#1b2631"/>
  <path d="M 104 55 A 19 19 0 0 1 140 55 Z" fill="#1b2631"/>

  <!-- WINDOWS -->
  <path d="M 90 16 L 112 16 Q 117 16 121 21 L 126 26 L 90 26 Z" fill="#17202a" stroke="#2c3e50" stroke-width="1"/>
  <rect x="40" y="26" width="20" height="10" rx="1" fill="#17202a" stroke="#2c3e50" stroke-width="1"/>
  <rect x="64" y="26" width="18" height="10" rx="1" fill="#17202a" stroke="#2c3e50" stroke-width="1"/>

  <!-- MOUNTAIN MOTIF LIVERY (peak silhouette) -->
  <path d="M 30 46 L 40 36 L 48 44 L 56 34 L 66 46 Z" fill="#2e86c1"/>
  <path d="M 52 40 L 56 34 L 60 40 Z" fill="#ecf0f1"/>

  <!-- ROOF LIGHT POD (rally equipment) -->
  <rect x="62" y="6" width="30" height="6" rx="2" fill="#2c3e50"/>
  <rect x="65" y="7.5" width="7" height="3" rx="1" fill="#f1c40f"/>
  <rect x="74" y="7.5" width="7" height="3" rx="1" fill="#f1c40f"/>
  <rect x="83" y="7.5" width="7" height="3" rx="1" fill="#f1c40f"/>

  <!-- REAR SPARE WHEEL (rally equipment) -->
  <circle cx="18" cy="34" r="9.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
  <circle cx="18" cy="34" r="6.5" fill="#5d6d7e"/>
  <circle cx="18" cy="34" r="2.5" fill="#bdc3c7"/>

  <!-- MUD FLAPS -->
  <rect x="30" y="55" width="8" height="6" fill="#2c3e50"/>
  <rect x="104" y="55" width="8" height="6" fill="#2c3e50"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="145" cy="42" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="138" y="52" width="12" height="4" rx="1.5" fill="#566573"/>
</svg>
