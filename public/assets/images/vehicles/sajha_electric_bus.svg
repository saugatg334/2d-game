<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Sajha Electric Bus - modern clean EV (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="42" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="42" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="42" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="42" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="118" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- UNDERBODY CHASSIS (with battery pack) -->
  <rect x="14" y="55" width="134" height="6" rx="2" fill="#1b2631"/>
  <rect x="60" y="56" width="44" height="4" rx="2" fill="#0e6655"/>

  <!-- MODERN EV BODY (white with green accents, rounded) -->
  <path d="M 12 18 L 140 18 Q 152 18 152 30 L 152 52 Q 152 57 147 57 L 12 57 Q 8 57 8 53 L 8 22 Q 8 18 12 18 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>
  <path d="M 8 50 L 152 50 L 152 52 Q 152 57 147 57 L 8 57 Z" fill="#16a085"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 24 57 A 18 18 0 0 1 60 57 Z" fill="#1b2631"/>
  <path d="M 100 57 A 18 18 0 0 1 136 57 Z" fill="#1b2631"/>

  <!-- GREEN WINDOW BAND (sleek) -->
  <rect x="15" y="24" width="26" height="12" rx="2" fill="#17202a" stroke="#16a085" stroke-width="1.2"/>
  <rect x="45" y="24" width="26" height="12" rx="2" fill="#17202a" stroke="#16a085" stroke-width="1.2"/>
  <rect x="75" y="24" width="26" height="12" rx="2" fill="#17202a" stroke="#16a085" stroke-width="1.2"/>
  <rect x="105" y="24" width="22" height="12" rx="2" fill="#17202a" stroke="#16a085" stroke-width="1.2"/>
  <path d="M 132 24 L 146 27 L 146 36 L 132 36 Z" fill="#17202a" stroke="#16a085" stroke-width="1.2"/>

  <!-- ELECTRIC CUES: charge port + energy dots -->
  <circle cx="22" cy="45" r="3" fill="none" stroke="#16a085" stroke-width="1.5"/>
  <path d="M 22 42.5 L 22 45 L 24 45" stroke="#16a085" stroke-width="1.2" fill="none"/>
  <circle cx="96" cy="45" r="2" fill="#16a085"/>
  <circle cx="103" cy="45" r="2" fill="#16a085"/>
  <circle cx="110" cy="45" r="2" fill="#bdc3c7"/>

  <!-- GREEN DIAGONAL ACCENT -->
  <path d="M 8 40 L 152 40 L 152 43 L 8 43 Z" fill="#16a085" opacity="0.85"/>

  <!-- MODERN SLEEK HEADLIGHT STRIP -->
  <rect x="138" y="44" width="10" height="3" rx="1.5" fill="#5dade2"/>
  <circle cx="148" cy="49" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- ROOF SOLAR STRIP HINT -->
  <rect x="20" y="14" width="120" height="3" rx="1.5" fill="#16a085" opacity="0.6"/>
</svg>
