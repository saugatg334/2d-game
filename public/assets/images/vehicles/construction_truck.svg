<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Construction Truck - heavy dump truck (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="40" cy="67" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="40" cy="67" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="40" cy="67" r="6.5" fill="#ecf0f1"/>
    <circle cx="40" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="124" cy="67" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="124" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="124" cy="67" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="124" cy="67" r="6.5" fill="#ecf0f1"/>
    <circle cx="124" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- CHASSIS RAIL (heavy, double) -->
  <rect x="10" y="55" width="144" height="7" rx="2" fill="#1b2631"/>
  <rect x="10" y="62" width="144" height="3" fill="#0e1a26"/>

  <!-- TILTED DUMP BED (yellow, rear raised) -->
  <path d="M 10 18 L 96 26 L 96 54 L 10 54 Z" fill="#d5a021" stroke="#9a7d0a" stroke-width="1.5"/>
  <!-- BED RIBS -->
  <line x1="32" y1="21" x2="32" y2="54" stroke="#9a7d0a" stroke-width="1.2"/>
  <line x1="54" y1="24" x2="54" y2="54" stroke="#9a7d0a" stroke-width="1.2"/>
  <line x1="76" y1="26" x2="76" y2="54" stroke="#9a7d0a" stroke-width="1.2"/>
  <!-- TAILGATE -->
  <rect x="8" y="17" width="4" height="37" fill="#9a7d0a"/>
  <!-- HAZARD CHEVRON STRIPE ON BED LOWER EDGE -->
  <rect x="10" y="48" width="86" height="5" fill="#f4d03f"/>
  <path d="M 14 48 L 20 53 L 12 53 Z" fill="#1b2631"/>
  <path d="M 30 48 L 36 53 L 28 53 Z" fill="#1b2631"/>
  <path d="M 46 48 L 52 53 L 44 53 Z" fill="#1b2631"/>
  <path d="M 62 48 L 68 53 L 60 53 Z" fill="#1b2631"/>
  <path d="M 78 48 L 84 53 L 76 53 Z" fill="#1b2631"/>

  <!-- WHEEL ARCH OVER REAR WHEEL -->
  <path d="M 23 55 A 19 19 0 0 1 57 55 Z" fill="#1b2631"/>

  <!-- HEAVY CAB (front, charcoal) -->
  <path d="M 102 24 L 138 24 Q 146 24 149 32 L 152 44 L 152 55 L 102 55 Z" fill="#34495e" stroke="#2c3e50" stroke-width="1.5"/>
  <path d="M 108 30 L 132 30 Q 139 30 141 35 L 143 41 L 108 41 Z" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <!-- ORANGE ROOF BEACON -->
  <rect x="112" y="17" width="10" height="7" rx="2" fill="#e67e22" stroke="#a04000" stroke-width="1"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="126" y1="26" x2="126" y2="54" stroke="#2c3e50" stroke-width="1.2"/>
  <rect x="129" y="45" width="4" height="2.5" rx="1" fill="#ecf0f1"/>

  <!-- HEAVY BUMPER + HEADLIGHT -->
  <rect x="146" y="46" width="8" height="10" rx="1.5" fill="#566573"/>
  <circle cx="150" cy="51" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- EXHAUST STACK + MUD FLAP -->
  <rect x="97" y="12" width="4" height="43" fill="#7f8c8d" stroke="#34495e" stroke-width="0.5"/>
  <rect x="58" y="62" width="6" height="10" fill="#2c3e50"/>
</svg>
