<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Highway Patrol Jeep - police utility jeep (Side View, facing right) -->

  <!-- REAR WHEEL (knobby) -->
  <g id="rear-wheel">
    <circle cx="38" cy="66" r="16" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="38" cy="66" r="14" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="38" cy="66" r="10" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="38" cy="66" r="7" fill="#ecf0f1"/>
    <circle cx="38" cy="66" r="3.5" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (knobby) -->
  <g id="front-wheel">
    <circle cx="118" cy="66" r="16" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="66" r="14" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="118" cy="66" r="10" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="66" r="7" fill="#ecf0f1"/>
    <circle cx="118" cy="66" r="3.5" fill="#2c3e50"/>
  </g>

  <!-- CHASSIS RAIL (high clearance) -->
  <rect x="12" y="54" width="140" height="6" rx="2" fill="#1b2631"/>

  <!-- HARD-TOP JEEP BODY (white) -->
  <rect x="16" y="16" width="72" height="12" rx="2" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <rect x="16" y="28" width="92" height="26" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <path d="M 108 28 L 124 28 L 136 44 L 136 54 L 108 54 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <!-- WINDSHIELD -->
  <path d="M 110 30 L 122 30 L 132 44 L 110 44 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- POLICE SIDE STRIPE -->
  <rect x="16" y="42" width="120" height="6" fill="#2471a3"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="92" y1="28" x2="92" y2="54" stroke="#bdc3c7" stroke-width="1.2"/>
  <rect x="96" y="46" width="4" height="2.5" rx="1" fill="#2c3e50"/>
  <!-- SIDE WINDOWS -->
  <rect x="22" y="31" width="18" height="11" rx="1" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="46" y="31" width="18" height="11" rx="1" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="70" y="31" width="16" height="11" rx="1" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- DOOR SHIELD MARK (geometric) -->
  <path d="M 62 36 L 70 36 L 70 42 L 66 45 L 62 42 Z" fill="#2471a3" stroke="#154360" stroke-width="0.8"/>

  <!-- ROOF LIGHT BAR (red/blue) -->
  <rect x="30" y="9" width="44" height="7" rx="2" fill="#2c3e50"/>
  <rect x="33" y="10.5" width="17" height="4" rx="1" fill="#e74c3c"/>
  <rect x="54" y="10.5" width="17" height="4" rx="1" fill="#2980b9"/>

  <!-- BULL BAR (chrome tubes) -->
  <rect x="136" y="38" width="4" height="16" rx="1.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="140" y1="40" x2="140" y2="52" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="136" y1="40" x2="130" y2="40" stroke="#7f8c8d" stroke-width="2"/>

  <!-- WHEEL ARCHES + HEADLIGHT -->
  <path d="M 22 54 A 19 19 0 0 1 54 54 Z" fill="#1b2631"/>
  <path d="M 102 54 A 19 19 0 0 1 134 54 Z" fill="#1b2631"/>
  <circle cx="133" cy="47" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
</svg>
