<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Dirt Bike - off-road machine (Side View, facing right) -->

  <!-- REAR KNOBBY WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="64" r="15" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="42" cy="64" r="13.5" fill="none" stroke="#444444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="42" cy="64" r="9" fill="#bdc3c7"/>
    <circle cx="42" cy="64" r="6.5" fill="#7f8c8d"/>
    <circle cx="42" cy="64" r="3" fill="#2c3e50"/>
    <line x1="42" y1="55" x2="42" y2="73" stroke="#95a5a6" stroke-width="1.2"/>
    <line x1="33" y1="64" x2="51" y2="64" stroke="#95a5a6" stroke-width="1.2"/>
  </g>

  <!-- FRONT KNOBBY WHEEL -->
  <g id="front-wheel">
    <circle cx="120" cy="64" r="15" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="120" cy="64" r="13.5" fill="none" stroke="#444444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="120" cy="64" r="9" fill="#bdc3c7"/>
    <circle cx="120" cy="64" r="6.5" fill="#7f8c8d"/>
    <circle cx="120" cy="64" r="3" fill="#2c3e50"/>
    <line x1="120" y1="55" x2="120" y2="73" stroke="#95a5a6" stroke-width="1.2"/>
    <line x1="111" y1="64" x2="129" y2="64" stroke="#95a5a6" stroke-width="1.2"/>
  </g>

  <!-- LONG-TRAVEL SWINGARM & FORKS -->
  <line x1="42" y1="64" x2="66" y2="46" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="94" y1="30" x2="120" y2="64" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="97" y1="30" x2="121" y2="62" stroke="#d5dbdb" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="98" y="40" width="6" height="12" rx="2" fill="#5d6d7e" transform="rotate(35 101 46)"/>

  <!-- ENGINE (high, compact) -->
  <rect x="58" y="42" width="20" height="14" rx="3" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="68" cy="49" r="4" fill="#95a5a6"/>

  <!-- HIGH-ROUTED EXHAUST -->
  <path d="M 70 44 Q 56 44 44 38 L 34 34" stroke="#95a5a6" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- MINIMAL FRAME -->
  <path d="M 46 44 L 68 40 L 90 32 L 70 32 Z" fill="#2c3e50"/>

  <!-- TANK (dirt orange) -->
  <path d="M 64 32 Q 78 24 94 32 L 90 41 L 62 40 Z" fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
  <path d="M 68 30 Q 80 26 90 32" stroke="#f5b041" stroke-width="1.8" fill="none"/>

  <!-- SLIM FLAT SEAT -->
  <path d="M 34 32 Q 50 30 66 36 L 64 41 L 34 38 Z" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>

  <!-- HIGH FRONT FENDER -->
  <path d="M 96 30 Q 116 30 128 42 L 110 40 Z" fill="#e67e22" stroke="#a04000" stroke-width="1"/>

  <!-- REAR FENDER KICK-UP -->
  <path d="M 28 32 L 44 34 L 30 44 Z" fill="#e67e22"/>

  <!-- FRONT NUMBER PLATE -->
  <path d="M 116 26 L 130 30 L 124 44 L 112 38 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>

  <!-- HANDLEBARS -->
  <line x1="94" y1="30" x2="102" y2="16" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <rect x="98" y="14" width="12" height="4" rx="1.5" fill="#2c3e50"/>
  <circle cx="108" cy="24" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1.2"/>
</svg>
