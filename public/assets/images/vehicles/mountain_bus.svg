<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Bus - rugged high-route transport (Side View, facing right) -->

  <!-- ROOF LUGGAGE (loaded for the climb) -->
  <rect x="24" y="2" width="26" height="7" rx="1.5" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
  <rect x="54" y="3" width="20" height="6" rx="1.5" fill="#6d4c41" stroke="#4e342e" stroke-width="1"/>
  <rect x="78" y="4" width="16" height="5" rx="1" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
  <line x1="18" y1="10" x2="140" y2="10" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="26" y1="9" x2="26" y2="14" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="130" y1="9" x2="130" y2="14" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="42" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="42" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="42" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="42" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="118" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- UNDERBODY CHASSIS (raised stance) -->
  <rect x="14" y="55" width="134" height="6" rx="2" fill="#1b2631"/>

  <!-- TALL RUGGED BODY (earth red, boxy, high roof) -->
  <path d="M 12 14 L 146 14 Q 152 14 152 20 L 152 54 Q 152 57 148 57 L 12 57 Q 8 57 8 53 L 8 18 Q 8 14 12 14 Z" fill="#b03a2e" stroke="#7b241c" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 24 57 A 18 18 0 0 1 60 57 Z" fill="#1b2631"/>
  <path d="M 100 57 A 18 18 0 0 1 136 57 Z" fill="#1b2631"/>

  <!-- SMALL HIGH WINDOWS (mountain style) -->
  <rect x="16" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="36" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="56" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="76" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="96" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="116" y="20" width="16" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- DUST SKIRT PANEL -->
  <rect x="8" y="42" width="144" height="7" fill="#922b21"/>
  <rect x="8" y="34" width="144" height="2" fill="#e6b0aa" opacity="0.6"/>

  <!-- SNOW-PEAK EMBLEM (triangle) -->
  <path d="M 62 48 L 70 40 L 78 48 Z" fill="#ecf0f1"/>

  <!-- FRONT CAB + GRILLE -->
  <path d="M 134 30 L 146 34 L 146 53 L 134 53 Z" fill="#922b21"/>
  <rect x="138" y="38" width="7" height="8" rx="1" fill="#2c3e50"/>
  <circle cx="147" cy="48" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- SPARE FUEL CAN ON REAR -->
  <rect x="12" y="24" width="9" height="12" rx="1.5" fill="#d35400" stroke="#7b241c" stroke-width="1"/>
</svg>
