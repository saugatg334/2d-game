<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Terai Loader - local-market cargo loader (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="38" cy="69" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="38" cy="69" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="38" cy="69" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="38" cy="69" r="6" fill="#ecf0f1"/>
    <circle cx="38" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="122" cy="69" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="122" cy="69" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="122" cy="69" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="122" cy="69" r="6" fill="#ecf0f1"/>
    <circle cx="122" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- CHASSIS RAIL -->
  <rect x="12" y="58" width="140" height="6" rx="2" fill="#1b2631"/>

  <!-- OPEN CARGO PLATFORM (rear) -->
  <rect x="14" y="44" width="84" height="14" fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
  <!-- SIDE PANEL RIBS -->
  <line x1="32" y1="44" x2="32" y2="58" stroke="#a04000" stroke-width="1"/>
  <line x1="50" y1="44" x2="50" y2="58" stroke="#a04000" stroke-width="1"/>
  <line x1="68" y1="44" x2="68" y2="58" stroke="#a04000" stroke-width="1"/>
  <line x1="82" y1="44" x2="82" y2="58" stroke="#a04000" stroke-width="1"/>

  <!-- VISIBLE LOAD: SACKS + BRICK STACK -->
  <ellipse cx="30" cy="41" rx="9" ry="5.5" fill="#b9855c" stroke="#8d6e4a" stroke-width="1"/>
  <ellipse cx="46" cy="40.5" rx="8" ry="5" fill="#a97950" stroke="#8d6e4a" stroke-width="1"/>
  <rect x="60" y="40" width="8" height="4" fill="#b3591f"/>
  <rect x="69" y="40" width="8" height="4" fill="#c8683a"/>
  <rect x="64" y="36" width="8" height="4" fill="#b3591f"/>

  <!-- COMPACT CAB (front, olive) -->
  <path d="M 102 28 L 128 28 Q 138 28 143 36 L 147 44 Q 149 47 149 52 L 149 58 L 102 58 Z" fill="#7d8c46" stroke="#5a6633" stroke-width="1.5"/>
  <path d="M 108 33 L 124 33 Q 131 33 135 38 L 139 44 L 108 44 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="126" y1="30" x2="126" y2="57" stroke="#5a6633" stroke-width="1.2"/>
  <rect x="130" y="48" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- CANOPY OVER CAB -->
  <rect x="100" y="22" width="34" height="4" rx="1.5" fill="#5a6633"/>

  <!-- WHEEL ARCHES -->
  <path d="M 22 58 A 18 18 0 0 1 54 58 Z" fill="#1b2631"/>
  <path d="M 106 58 A 18 18 0 0 1 138 58 Z" fill="#1b2631"/>

  <!-- BUMPER + HEADLIGHT + EXHAUST -->
  <rect x="143" y="50" width="6" height="8" rx="1.5" fill="#566573"/>
  <circle cx="146" cy="54" r="2.4" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="96" y="22" width="4" height="36" fill="#7f8c8d" stroke="#34495e" stroke-width="0.5"/>
</svg>
