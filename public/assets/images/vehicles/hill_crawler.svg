<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Hill Crawler - purpose-built hill climber (Side View, facing right) -->

  <!-- OVERSIZED KNOBBY TIRES -->
  <g id="rear-wheel">
    <circle cx="40" cy="62" r="18" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="62" r="15.5" fill="none" stroke="#444444" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="40" cy="62" r="10" fill="#bdc3c7"/>
    <circle cx="40" cy="62" r="6.5" fill="#7f8c8d"/>
    <circle cx="40" cy="62" r="3" fill="#2c3e50"/>
  </g>
  <g id="front-wheel">
    <circle cx="124" cy="62" r="18" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="124" cy="62" r="15.5" fill="none" stroke="#444444" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="124" cy="62" r="10" fill="#bdc3c7"/>
    <circle cx="124" cy="62" r="6.5" fill="#7f8c8d"/>
    <circle cx="124" cy="62" r="3" fill="#2c3e50"/>
  </g>

  <!-- VERY HIGH-CLEARANCE EXPOSED CHASSIS (tubular rails) -->
  <rect x="24" y="42" width="118" height="6" rx="3" fill="#5d6d7e"/>
  <rect x="28" y="54" width="110" height="5" rx="2.5" fill="#34495e"/>
  <line x1="44" y1="48" x2="44" y2="56" stroke="#566573" stroke-width="3"/>
  <line x1="122" y1="48" x2="122" y2="56" stroke="#566573" stroke-width="3"/>

  <!-- EXPOSED ENGINE (rear-mid) -->
  <rect x="58" y="30" width="26" height="14" rx="2" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="66" cy="37" r="3.5" fill="#95a5a6"/>
  <circle cx="76" cy="37" r="3.5" fill="#95a5a6"/>
  <rect x="66" y="24" width="4" height="6" fill="#7f8c8d"/>

  <!-- ROLL CAGE (open, over the seat) -->
  <path d="M 36 42 L 36 16 L 58 10 L 84 10 L 84 30" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="26" x2="84" y2="26" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="36" y1="16" x2="58" y2="26" stroke="#2c3e50" stroke-width="2"/>

  <!-- SEAT + STEERING -->
  <path d="M 44 30 L 54 30 L 52 40 L 42 40 Z" fill="#5d4037"/>
  <line x1="88" y1="34" x2="94" y2="24" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- FRONT HOOD + LIGHTS -->
  <path d="M 92 42 L 92 32 L 116 32 L 118 42 Z" fill="#b9770e" stroke="#7d6608" stroke-width="1.5"/>
  <circle cx="130" cy="34" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="130" cy="40" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- STRONG FRONT BUMPER -->
  <rect x="134" y="36" width="9" height="12" rx="1.5" fill="#566573"/>
  <line x1="136" y1="40" x2="141" y2="40" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- REAR FUEL TANK -->
  <rect x="14" y="30" width="14" height="12" rx="2" fill="#d35400" stroke="#7b241c" stroke-width="1"/>
</svg>
