<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Sajha Local Bus Body & Wheels (Side View, facing right) -->
  
  <!-- REAR BUS WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="42" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="42" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="42" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="42" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- FRONT BUS WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="118" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- BUS UNDERBODY CHASSIS BAR -->
  <rect x="15" y="55" width="130" height="6" rx="2" fill="#1b2631"/>

  <!-- MAIN BUS BODY SHELL (Green Sajha Bus) -->
  <path d="M 12 16 L 148 16 Q 152 16 152 20 L 152 54 Q 152 57 148 57 L 12 57 Q 8 57 8 53 L 8 20 Q 8 16 12 16 Z" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS (Clear separation between body and wheels) -->
  <path d="M 24 57 A 18 18 0 0 1 60 57 Z" fill="#1b2631"/>
  <path d="M 100 57 A 18 18 0 0 1 136 57 Z" fill="#1b2631"/>

  <!-- TOP DESTINATION HEADER BOX ("KATHMANDU - POKHARA") -->
  <rect x="25" y="11" width="110" height="8" rx="2" fill="#f1c40f"/>
  <rect x="30" y="13" width="100" height="4" fill="#2c3e50"/>

  <!-- MIDDLE WHITE STRIPE -->
  <rect x="8" y="34" width="144" height="8" fill="#ffffff"/>

  <!-- PASSENGER WINDOWS -->
  <rect x="18" y="21" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="40" y="21" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="62" y="21" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="84" y="21" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="106" y="21" width="22" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>

  <!-- FRONT WINDSHIELD NOSE & HEADLIGHT -->
  <path d="M 130 21 L 146 25 L 146 53 L 130 53 Z" fill="#229954"/>
  <circle cx="144" cy="46" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- ROOF LUGGAGE RACK WITH LUGGAGE BAGS -->
  <line x1="20" y1="9" x2="135" y2="9" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="30" y="4" width="20" height="5" rx="1" fill="#d35400"/>
  <rect x="55" y="3" width="25" height="6" rx="1.5" fill="#2980b9"/>
  <rect x="85" y="5" width="18" height="4" rx="1" fill="#8e44ad"/>
</svg>
