<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Sajha Bus Body (Side View, facing right) -->
  <!-- Main Bus Body Shell -->
  <rect x="12" y="16" width="136" height="44" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <!-- Top Destination Header Box ("KATHMANDU - POKHARA") -->
  <rect x="25" y="12" width="110" height="8" rx="2" fill="#f1c40f"/>
  <rect x="30" y="14" width="100" height="4" fill="#2c3e50"/>
  <!-- Middle White Stripe -->
  <rect x="12" y="34" width="136" height="8" fill="#ffffff"/>
  <!-- Passenger Windows -->
  <rect x="20" y="22" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="42" y="22" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="64" y="22" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="86" y="22" width="18" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="108" y="22" width="22" height="11" rx="2" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <!-- Front Windshield & Headlight Nose -->
  <path d="M 132 22 L 144 26 L 144 54 L 132 54 Z" fill="#229954"/>
  <circle cx="142" cy="46" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <!-- Roof Luggage Rack with Luggage Bags -->
  <line x1="20" y1="10" x2="135" y2="10" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="30" y="5" width="20" height="5" rx="1" fill="#d35400"/>
  <rect x="55" y="4" width="25" height="6" rx="1.5" fill="#2980b9"/>
  <rect x="85" y="6" width="18" height="4" rx="1" fill="#8e44ad"/>
  <!-- Wheel Arch Cutouts -->
  <path d="M 28 60 A 14 14 0 0 1 52 60" fill="none" stroke="#1e8449" stroke-width="2"/>
  <path d="M 98 60 A 14 14 0 0 1 122 60" fill="none" stroke="#1e8449" stroke-width="2"/>
</svg>
