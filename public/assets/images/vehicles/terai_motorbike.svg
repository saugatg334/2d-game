<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Terai Motorbike - practical commuter (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="66" r="13" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="44" cy="66" r="12" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="44" cy="66" r="8.5" fill="#bdc3c7"/>
    <circle cx="44" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="44" cy="66" r="3" fill="#2c3e50"/>
    <line x1="44" y1="58" x2="44" y2="74" stroke="#95a5a6" stroke-width="1"/>
    <line x1="36" y1="66" x2="52" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="116" cy="66" r="13" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="116" cy="66" r="12" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="116" cy="66" r="8.5" fill="#bdc3c7"/>
    <circle cx="116" cy="66" r="6.5" fill="#7f8c8d"/>
    <circle cx="116" cy="66" r="3" fill="#2c3e50"/>
    <line x1="116" y1="58" x2="116" y2="74" stroke="#95a5a6" stroke-width="1"/>
    <line x1="108" y1="66" x2="124" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- SWINGARM & FORKS -->
  <line x1="44" y1="66" x2="66" y2="54" stroke="#7f8c8d" stroke-width="4" stroke-linecap="round"/>
  <line x1="98" y1="38" x2="116" y2="66" stroke="#7f8c8d" stroke-width="4" stroke-linecap="round"/>

  <!-- ENGINE (small commuter block) -->
  <rect x="58" y="46" width="20" height="14" rx="3" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="68" cy="53" r="4" fill="#95a5a6"/>

  <!-- EXHAUST (plain low pipe) -->
  <path d="M 66 56 Q 52 58 40 54 L 32 52" stroke="#8d6e63" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- MAIN FRAME -->
  <path d="M 46 48 L 68 46 L 90 40 L 70 38 Z" fill="#2c3e50"/>

  <!-- FUEL TANK (Terai olive) -->
  <path d="M 64 38 Q 78 30 94 38 L 90 47 L 62 46 Z" fill="#6b8e23" stroke="#4a5d17" stroke-width="1.5"/>
  <path d="M 68 36 Q 80 32 90 38" stroke="#98bf46" stroke-width="1.5" fill="none"/>

  <!-- LONG COMMUTER SEAT -->
  <path d="M 36 38 Q 52 36 68 42 L 66 47 L 36 44 Z" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>

  <!-- REAR CARRIER RACK -->
  <line x1="30" y1="36" x2="42" y2="40" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="36" x2="30" y2="44" stroke="#7f8c8d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- FRONT FENDER -->
  <path d="M 100 44 Q 114 44 122 54 L 108 52 Z" fill="#6b8e23"/>

  <!-- HANDLEBARS, MIRROR & ROUND HEADLIGHT -->
  <line x1="98" y1="38" x2="106" y2="24" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="26" x2="110" y2="16" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="111" cy="15" r="2.5" fill="#7f8c8d"/>
  <circle cx="104" cy="34" r="4.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1.5"/>
</svg>
