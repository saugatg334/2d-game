<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Ambulance - emergency utility (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="68" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="44" cy="68" r="11.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="44" cy="68" r="8.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="44" cy="68" r="6" fill="#ecf0f1"/>
    <circle cx="44" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="13" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="11.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="68" r="8.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="6" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- BOXY AMBULANCE BODY (white) -->
  <path d="M 26 22 L 100 22 L 100 57 L 26 57 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <path d="M 100 26 L 118 26 Q 130 26 137 34 L 143 42 Q 145 45 145 50 L 145 54 Q 145 57 141 57 L 100 57 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 31 57 A 16 16 0 0 1 59 57 Z" fill="#1b2631"/>
  <path d="M 105 57 A 16 16 0 0 1 133 57 Z" fill="#1b2631"/>

  <!-- RED EMERGENCY STRIPE -->
  <rect x="26" y="44" width="119" height="5" fill="#e74c3c"/>

  <!-- GEOMETRIC CROSS MARK (rear panel) -->
  <rect x="40" y="30" width="6" height="16" fill="#e74c3c"/>
  <rect x="35" y="35" width="16" height="6" fill="#e74c3c"/>

  <!-- CAB WINDOW + REAR WINDOW -->
  <path d="M 116 30 L 130 30 Q 136 31 140 37 L 142 42 L 116 42 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="102" y="30" width="11" height="11" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="30" y="28" width="4" height="10" fill="#aed6f1" stroke="#2c3e50" stroke-width="0.8"/>

  <!-- EMERGENCY LIGHT BAR (red/blue modules) -->
  <rect x="46" y="15" width="40" height="7" rx="2" fill="#2c3e50"/>
  <rect x="49" y="16.5" width="14" height="4" rx="1" fill="#e74c3c"/>
  <rect x="67" y="16.5" width="14" height="4" rx="1" fill="#2980b9"/>

  <!-- SIDE MIRROR -->
  <line x1="116" y1="28" x2="112" y2="22" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="108" y="19" width="5" height="4" rx="1" fill="#2c3e50"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="141" cy="48" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="132" y="53" width="16" height="4" rx="1.5" fill="#566573"/>
</svg>
