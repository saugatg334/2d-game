<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Pickup - compact raised 4x4 pickup (Side View, facing right) -->

  <!-- REAR WHEEL (large knobby) -->
  <g id="rear-wheel">
    <circle cx="40" cy="67" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="40" cy="67" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="40" cy="67" r="6.5" fill="#ecf0f1"/>
    <circle cx="40" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (large knobby) -->
  <g id="front-wheel">
    <circle cx="118" cy="67" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2.5"/>
    <circle cx="118" cy="67" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="67" r="6.5" fill="#ecf0f1"/>
    <circle cx="118" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- RAISED CHASSIS + SUSPENSION LINKS -->
  <rect x="14" y="55" width="138" height="6" rx="2" fill="#1b2631"/>
  <line x1="48" y1="55" x2="44" y2="61" stroke="#566573" stroke-width="2"/>
  <line x1="126" y1="55" x2="122" y2="61" stroke="#566573" stroke-width="2"/>

  <!-- OPEN BED WITH CARGO (rear) -->
  <rect x="16" y="40" width="54" height="15" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <!-- CARGO SACKS PEEKING ABOVE BED -->
  <ellipse cx="34" cy="39" rx="10" ry="6" fill="#b9855c" stroke="#8d6e4a" stroke-width="1"/>
  <ellipse cx="52" cy="38.5" rx="9" ry="5.5" fill="#a97950" stroke="#8d6e4a" stroke-width="1"/>
  <!-- BED RIBS -->
  <line x1="32" y1="42" x2="32" y2="55" stroke="#922b21" stroke-width="1"/>
  <line x1="48" y1="42" x2="48" y2="55" stroke="#922b21" stroke-width="1"/>

  <!-- ROLL BAR OVER BED -->
  <path d="M 60 42 L 60 24 Q 60 21 63 21 L 66 21 Q 69 21 69 24 L 69 42" fill="none" stroke="#5d5d4e" stroke-width="3.5"/>

  <!-- SHORT RUGGED CAB -->
  <path d="M 72 24 L 100 24 Q 106 24 110 29 L 116 37 L 116 55 L 72 55 Z" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <path d="M 78 29 L 96 29 Q 102 29 106 34 L 110 39 L 78 39 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <!-- WINDSHIELD -->
  <path d="M 112 30 L 116 36 L 116 41 L 108 41 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- SNORKEL -->
  <rect x="98" y="16" width="4" height="12" fill="#2c3e50"/>
  <rect x="96" y="12" width="8" height="5" rx="1.5" fill="#2c3e50"/>

  <!-- BULL BAR + FOG LIGHTS -->
  <rect x="118" y="40" width="4" height="15" rx="1.5" fill="#5d5d4e"/>
  <line x1="122" y1="42" x2="122" y2="53" stroke="#5d5d4e" stroke-width="2"/>
  <circle cx="114" cy="47" r="2" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="114" cy="52" r="2" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- MUD FLAP -->
  <rect x="20" y="61" width="6" height="9" fill="#2c3e50"/>

  <!-- WHEEL ARCHES -->
  <path d="M 22 55 A 19 19 0 0 1 58 55 Z" fill="#1b2631"/>
  <path d="M 100 55 A 19 19 0 0 1 136 55 Z" fill="#1b2631"/>
</svg>
