<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Electric Tempo - modern electric three-wheeler tempo (Side View, facing right) -->

  <!-- TWIN REAR WHEELS -->
  <g id="rear-wheel">
    <circle cx="38" cy="68" r="10" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="38" cy="68" r="7.5" fill="#bdc3c7"/>
    <circle cx="38" cy="68" r="3" fill="#2c3e50"/>
    <circle cx="50" cy="68" r="10" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="50" cy="68" r="7.5" fill="#bdc3c7"/>
    <circle cx="50" cy="68" r="3" fill="#2c3e50"/>
    <circle cx="44" cy="68" r="10" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- SMALL FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="128" cy="70" r="9" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="128" cy="70" r="6.5" fill="#bdc3c7"/>
    <circle cx="128" cy="70" r="2.5" fill="#2c3e50"/>
    <circle cx="128" cy="70" r="3.5" fill="none" stroke="#00bcd4" stroke-width="1.2"/>
  </g>

  <!-- FRONT FORK / TILLER STEM -->
  <line x1="118" y1="40" x2="128" y2="70" stroke="#95a5a6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ROUNDED CANOPY CABIN (white, cyan roof edge) -->
  <path d="M 26 58 L 26 40 Q 26 22 52 22 L 86 22 Q 104 22 108 40 L 110 58 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>
  <path d="M 28 26 Q 44 20 70 20" stroke="#00bcd4" stroke-width="2.5" fill="none"/>

  <!-- WINDSHIELD (front sloped) -->
  <path d="M 92 27 Q 103 30 106 42 L 108 52 L 94 52 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- SIDE WINDOW + DOOR LINE -->
  <path d="M 34 30 L 66 30 L 66 50 L 32 50 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <line x1="88" y1="26" x2="88" y2="57" stroke="#aab7b8" stroke-width="1.2"/>
  <rect x="90" y="48" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- FLOOR BATTERY PACK -->
  <rect x="30" y="56" width="72" height="7" rx="2" fill="#2c3e50"/>
  <line x1="36" y1="59.5" x2="96" y2="59.5" stroke="#00bcd4" stroke-width="1.2" opacity="0.8"/>
  <circle cx="58" cy="59.5" r="1.8" fill="#00bcd4"/>

  <!-- TILLER HANDLEBAR -->
  <line x1="106" y1="38" x2="114" y2="36" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <rect x="112" y="33" width="7" height="4" rx="1.5" fill="#2c3e50"/>

  <!-- REAR CARGO BOX HINT -->
  <rect x="12" y="44" width="12" height="14" rx="1" fill="#1abc9c" stroke="#148f77" stroke-width="1"/>

  <!-- HEADLIGHT -->
  <circle cx="110" cy="46" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="108" y="56" width="8" height="4" rx="1" fill="#566573"/>
</svg>
