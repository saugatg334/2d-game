<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Rock Crawler - extreme articulated machine (Side View, facing right) -->

  <!-- HUGE CRAWLER TIRES (biggest in game) -->
  <g id="rear-wheel">
    <circle cx="38" cy="60" r="20" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <circle cx="38" cy="60" r="17" fill="none" stroke="#444444" stroke-width="3.5" stroke-dasharray="6,3"/>
    <circle cx="38" cy="60" r="11" fill="#bdc3c7"/>
    <circle cx="38" cy="60" r="7" fill="#7f8c8d"/>
    <circle cx="38" cy="60" r="3.5" fill="#2c3e50"/>
    <path d="M 38 46 L 38 74 M 24 60 L 52 60" stroke="#95a5a6" stroke-width="1.5"/>
  </g>
  <g id="front-wheel">
    <circle cx="126" cy="60" r="20" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <circle cx="126" cy="60" r="17" fill="none" stroke="#444444" stroke-width="3.5" stroke-dasharray="6,3"/>
    <circle cx="126" cy="60" r="11" fill="#bdc3c7"/>
    <circle cx="126" cy="60" r="7" fill="#7f8c8d"/>
    <circle cx="126" cy="60" r="3.5" fill="#2c3e50"/>
    <path d="M 126 46 L 126 74 M 112 60 L 140 60" stroke="#95a5a6" stroke-width="1.5"/>
  </g>

  <!-- ARTICULATED OPEN FRAME (two section rails + pivot) -->
  <rect x="26" y="38" width="52" height="6" rx="3" fill="#5d6d7e"/>
  <rect x="86" y="38" width="52" height="6" rx="3" fill="#5d6d7e"/>
  <circle cx="82" cy="41" r="5" fill="#2c3e50" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="40" y1="44" x2="40" y2="54" stroke="#566573" stroke-width="3"/>
  <line x1="124" y1="44" x2="124" y2="54" stroke="#566573" stroke-width="3"/>
  <rect x="30" y="52" width="104" height="4" rx="2" fill="#34495e"/>

  <!-- EXTREME ROLL CAGE (full exo frame) -->
  <path d="M 34 38 L 34 10 L 60 6 L 88 6 L 88 24 L 100 30" fill="none" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="88" y2="20" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="34" y1="10" x2="60" y2="20" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="6" x2="60" y2="20" stroke="#2c3e50" stroke-width="2"/>

  <!-- SEAT -->
  <path d="M 42 26 L 54 26 L 52 36 L 40 36 Z" fill="#5d4037"/>
  <line x1="94" y1="28" x2="88" y2="20" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- FRONT WINCH + STINGER BUMPER -->
  <rect x="132" y="30" width="12" height="10" rx="2" fill="#566573"/>
  <circle cx="136" cy="35" r="3" fill="#2c3e50"/>
  <line x1="138" y1="30" x2="148" y2="24" stroke="#7f8c8d" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="149" cy="23" r="2.5" fill="#e74c3c"/>

  <!-- HOOD PANEL + LIGHTS -->
  <rect x="100" y="30" width="24" height="8" rx="1.5" fill="#b9770e" stroke="#7d6608" stroke-width="1"/>
  <circle cx="118" cy="28" r="2.8" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <circle cx="118" cy="34" r="2.2" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- REAR DRIVELINE + FUEL -->
  <rect x="14" y="26" width="14" height="12" rx="2" fill="#d35400" stroke="#7b241c" stroke-width="1"/>
  <circle cx="64" cy="46" r="4" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
</svg>
