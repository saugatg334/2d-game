<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Electric Micro - compact electric microbus (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="44" cy="70" r="12" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="44" cy="70" r="10.5" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="44" cy="70" r="7.5" fill="#bdc3c7"/>
    <circle cx="44" cy="70" r="4.5" fill="#7f8c8d"/>
    <circle cx="44" cy="70" r="2.5" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="116" cy="70" r="12" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="116" cy="70" r="10.5" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="116" cy="70" r="7.5" fill="#bdc3c7"/>
    <circle cx="116" cy="70" r="4.5" fill="#7f8c8d"/>
    <circle cx="116" cy="70" r="2.5" fill="#2c3e50"/>
  </g>

  <!-- UNDERBODY BATTERY PACK -->
  <rect x="42" y="58" width="72" height="6" rx="2" fill="#2c3e50"/>
  <line x1="48" y1="61" x2="108" y2="61" stroke="#00bcd4" stroke-width="1.2" opacity="0.8"/>

  <!-- BOXY CABIN (white/teal modern) -->
  <path d="M 22 26 L 108 26 L 108 58 L 22 58 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>
  <path d="M 108 26 L 124 26 Q 136 26 140 36 L 142 46 Q 143 50 140 50 L 108 50 Z" fill="#ecf0f1" stroke="#aab7b8" stroke-width="1.5"/>

  <!-- TEAL BELTLINE STRIPE -->
  <rect x="22" y="48" width="120" height="4" fill="#1abc9c"/>

  <!-- WINDSHIELD + CAB WINDOW -->
  <path d="M 112 31 L 124 31 Q 132 31 136 38 L 138 44 L 112 44 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- PASSENGER WINDOWS -->
  <rect x="28" y="31" width="20" height="13" rx="1.5" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <rect x="54" y="31" width="20" height="13" rx="1.5" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- SLIDING DOOR (rail + line) -->
  <line x1="80" y1="27" x2="80" y2="57" stroke="#aab7b8" stroke-width="1.2"/>
  <rect x="84" y="31" width="18" height="13" rx="1.5" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <line x1="82" y1="52" x2="102" y2="52" stroke="#7f8c8d" stroke-width="1.2"/>
  <rect x="86" y="50" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- CHARGE PORT + CABLE HINT -->
  <circle cx="30" cy="53" r="2.5" fill="none" stroke="#00bcd4" stroke-width="1.2"/>
  <path d="M 26 53 Q 20 53 20 58" stroke="#00bcd4" stroke-width="1" fill="none"/>

  <!-- WHEEL ARCHES -->
  <path d="M 32 58 A 15 15 0 0 1 56 58 Z" fill="#1b2631"/>
  <path d="M 104 58 A 15 15 0 0 1 128 58 Z" fill="#1b2631"/>

  <!-- BUMPER + HEADLIGHT -->
  <rect x="136" y="46" width="7" height="8" rx="1.5" fill="#566573"/>
  <circle cx="139" cy="49" r="2.2" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
</svg>
