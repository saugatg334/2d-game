<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Hill Pickup - boxy Nepal utility pickup (Side View, facing right) -->

  <!-- REAR WHEEL (chunky) -->
  <g id="rear-wheel">
    <circle cx="40" cy="69" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="69" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2"/>
    <circle cx="40" cy="69" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="40" cy="69" r="6" fill="#ecf0f1"/>
    <circle cx="40" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (chunky) -->
  <g id="front-wheel">
    <circle cx="120" cy="69" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="120" cy="69" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3.5,2"/>
    <circle cx="120" cy="69" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="120" cy="69" r="6" fill="#ecf0f1"/>
    <circle cx="120" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- HIGH-CLEARANCE CHASSIS -->
  <rect x="14" y="57" width="136" height="6" rx="2" fill="#1b2631"/>

  <!-- SHORT OPEN REAR BED -->
  <rect x="14" y="38" width="52" height="19" fill="#c9a86a" stroke="#a3854e" stroke-width="1.5"/>
  <rect x="18" y="42" width="44" height="11" fill="#b2925a"/>
  <line x1="30" y1="38" x2="30" y2="57" stroke="#a3854e" stroke-width="1"/>
  <line x1="44" y1="38" x2="44" y2="57" stroke="#a3854e" stroke-width="1"/>

  <!-- BOXY FRONT CABIN (tall two-box) -->
  <rect x="70" y="22" width="58" height="35" fill="#c9a86a" stroke="#a3854e" stroke-width="1.5"/>
  <path d="M 128 26 L 138 26 Q 145 26 148 34 L 151 44 L 151 57 L 128 57 Z" fill="#c9a86a" stroke="#a3854e" stroke-width="1.5"/>
  <!-- CAB WINDOWS -->
  <rect x="76" y="27" width="18" height="13" rx="1" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <rect x="100" y="27" width="18" height="13" rx="1" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>
  <path d="M 132 30 L 138 30 Q 142 31 145 37 L 146 41 L 132 41 Z" fill="#d6eaf8" stroke="#2c3e50" stroke-width="1"/>

  <!-- DARK CLADDING (lower body) -->
  <rect x="14" y="52" width="137" height="5" fill="#5d5d4e"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="96" y1="23" x2="96" y2="56" stroke="#a3854e" stroke-width="1.2"/>
  <rect x="100" y="48" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- ROOF RAILS -->
  <rect x="72" y="19" width="54" height="3" fill="#5d5d4e"/>

  <!-- BULL BAR + HEADLIGHT -->
  <rect x="149" y="44" width="4" height="13" rx="1.5" fill="#7f8c8d"/>
  <line x1="151" y1="46" x2="151" y2="55" stroke="#7f8c8d" stroke-width="2"/>
  <circle cx="147" cy="48" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- WHEEL ARCHES -->
  <path d="M 24 57 A 18 18 0 0 1 56 57 Z" fill="#1b2631"/>
  <path d="M 104 57 A 18 18 0 0 1 136 57 Z" fill="#1b2631"/>
</svg>
