<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Mountain Moped - hill/village runabout (Side View, facing right) -->

  <!-- REAR SMALL WHEEL -->
  <g id="rear-wheel">
    <circle cx="46" cy="68" r="11" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="46" cy="68" r="10" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="46" cy="68" r="7" fill="#bdc3c7"/>
    <circle cx="46" cy="68" r="5" fill="#7f8c8d"/>
    <circle cx="46" cy="68" r="2.5" fill="#2c3e50"/>
    <line x1="46" y1="61" x2="46" y2="75" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="39" y1="68" x2="53" y2="68" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FRONT SMALL WHEEL -->
  <g id="front-wheel">
    <circle cx="114" cy="68" r="11" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="114" cy="68" r="10" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="114" cy="68" r="7" fill="#bdc3c7"/>
    <circle cx="114" cy="68" r="5" fill="#7f8c8d"/>
    <circle cx="114" cy="68" r="2.5" fill="#2c3e50"/>
    <line x1="114" y1="61" x2="114" y2="75" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="107" y1="68" x2="121" y2="68" stroke="#ecf0f1" stroke-width="1"/>
  </g>

  <!-- FORK & SWINGARM -->
  <line x1="100" y1="42" x2="114" y2="68" stroke="#7f8c8d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="68" x2="62" y2="56" stroke="#7f8c8d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- SMALL ENGINE UNDER SEAT -->
  <rect x="58" y="52" width="16" height="11" rx="3" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="66" cy="58" r="3.5" fill="#95a5a6"/>

  <!-- EXHAUST (short) -->
  <path d="M 64 60 Q 54 62 46 58" stroke="#8d6e63" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- STEP-THROUGH FRAME (low curve) -->
  <path d="M 48 52 Q 56 44 66 48 L 72 52 Q 84 50 96 46" stroke="#16a085" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- REAR BODY / SEAT BASE -->
  <path d="M 40 44 Q 54 40 68 46 L 66 54 L 42 52 Z" fill="#16a085" stroke="#0e6655" stroke-width="1.5"/>

  <!-- SINGLE SEAT -->
  <path d="M 38 42 Q 52 38 66 44 L 64 49 L 38 46 Z" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>

  <!-- REAR CARRIER -->
  <line x1="34" y1="40" x2="44" y2="43" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/>
  <rect x="30" y="34" width="12" height="6" rx="1.5" fill="#7f8c8d" stroke="#566573" stroke-width="1"/>

  <!-- FRONT APRON (thin) -->
  <path d="M 90 50 L 102 32 Q 106 28 103 25 L 94 30 L 84 48 Z" fill="#16a085" stroke="#0e6655" stroke-width="1.5"/>

  <!-- FRONT MUDGUARD -->
  <path d="M 102 52 Q 112 50 118 60 L 106 58 Z" fill="#0e6655"/>

  <!-- HANDLEBARS, MIRROR & HEADLIGHT -->
  <line x1="100" y1="42" x2="107" y2="28" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="29" x2="111" y2="19" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="112" cy="18" r="2.2" fill="#7f8c8d"/>
  <circle cx="105" cy="37" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1.5"/>
</svg>
