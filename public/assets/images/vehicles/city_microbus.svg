<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- City Microbus - modern Kathmandu urban microbus (Side View, facing right) -->

  <!-- REAR WHEEL (compact) -->
  <g id="rear-wheel">
    <circle cx="44" cy="69" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="44" cy="69" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="44" cy="69" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="44" cy="69" r="5.5" fill="#ecf0f1"/>
    <circle cx="44" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (compact) -->
  <g id="front-wheel">
    <circle cx="116" cy="69" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="116" cy="69" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="116" cy="69" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="116" cy="69" r="5.5" fill="#ecf0f1"/>
    <circle cx="116" cy="69" r="3" fill="#2c3e50"/>
  </g>

  <!-- SHORT BOXY PASSENGER BODY (clean white) -->
  <path d="M 26 24 L 108 24 L 108 57 L 26 57 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <path d="M 108 24 L 124 24 Q 135 24 140 33 L 143 42 Q 145 46 145 51 L 145 57 L 108 57 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>

  <!-- ORANGE BELTLINE BAND -->
  <rect x="26" y="47" width="119" height="5" fill="#e67e22"/>

  <!-- WINDSHIELD + CAB WINDOW -->
  <path d="M 112 29 L 124 29 Q 132 29 136 36 L 138 42 L 112 42 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- TALL SIDE WINDOWS (public-transport look) -->
  <rect x="32" y="29" width="22" height="15" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="58" y="29" width="22" height="15" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- SLIDING PASSENGER DOOR (window + rail + handle) -->
  <rect x="84" y="29" width="20" height="15" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <line x1="82" y1="25" x2="82" y2="56" stroke="#bdc3c7" stroke-width="1.3"/>
  <line x1="84" y1="53" x2="104" y2="53" stroke="#95a5a6" stroke-width="1.5"/>
  <rect x="86" y="50" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- WHEEL ARCHES -->
  <path d="M 31 57 A 16 16 0 0 1 57 57 Z" fill="#1b2631"/>
  <path d="M 103 57 A 16 16 0 0 1 129 57 Z" fill="#1b2631"/>

  <!-- ROOF EDGE TRIM -->
  <rect x="28" y="21" width="78" height="3" rx="1.5" fill="#bdc3c7"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="141" cy="47" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="136" y="52" width="14" height="5" rx="1.5" fill="#566573"/>
</svg>
