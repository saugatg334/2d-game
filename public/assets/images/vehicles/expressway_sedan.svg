<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Expressway Sedan - modern highway fast-track sedan (Side View, facing right) -->

  <!-- REAR WHEEL (large road) -->
  <g id="rear-wheel">
    <circle cx="42" cy="67" r="14.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="42" cy="67" r="9.5" fill="#7f8c8d"/>
    <circle cx="42" cy="67" r="6" fill="#95a5a6"/>
    <circle cx="42" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (large road) -->
  <g id="front-wheel">
    <circle cx="120" cy="67" r="14.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="120" cy="67" r="13" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="120" cy="67" r="9.5" fill="#7f8c8d"/>
    <circle cx="120" cy="67" r="6" fill="#95a5a6"/>
    <circle cx="120" cy="67" r="3" fill="#2c3e50"/>
  </g>

  <!-- THREE-BOX SEDAN BODY (silver, aero) -->
  <path d="M 12 55 Q 12 44 24 40 L 38 36 Q 48 26 66 25 L 88 25 Q 104 26 114 34 L 128 37 Q 146 41 150 48 Q 152 52 150 55 Z"
        fill="#bdc3c7" stroke="#95a5a6" stroke-width="1.5"/>

  <!-- SMOOTH GLASSHOUSE WITH CHROME TRIM -->
  <path d="M 44 35 Q 54 28 68 27 L 86 27 Q 100 28 108 34 L 102 39 Q 90 33 74 33 Q 60 33 50 39 Z"
        fill="#5d6d7e" stroke="#2c3e50" stroke-width="1"/>
  <line x1="44" y1="36" x2="108" y2="36" stroke="#ecf0f1" stroke-width="1" opacity="0.8"/>

  <!-- DOOR LINE + CHROME HANDLE -->
  <line x1="78" y1="34" x2="78" y2="54" stroke="#95a5a6" stroke-width="1"/>
  <line x1="84" y1="44" x2="92" y2="44" stroke="#ecf0f1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- SLEEK MODERN HEADLIGHT (swept) -->
  <path d="M 136 45 L 149 48 L 148 51 L 135 49 Z" fill="#f9e79f" stroke="#f1c40f" stroke-width="1"/>

  <!-- BOOT LIP (subtle) -->
  <path d="M 12 42 L 20 39 L 21 43 Z" fill="#95a5a6"/>

  <!-- ROCKER LINE -->
  <line x1="52" y1="54" x2="112" y2="54" stroke="#95a5a6" stroke-width="1.5" opacity="0.6"/>

  <!-- REAR LIGHT STRIP -->
  <rect x="12" y="47" width="4" height="2.5" rx="1" fill="#e74c3c"/>
</svg>
