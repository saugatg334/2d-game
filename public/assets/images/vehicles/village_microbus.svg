<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Village Microbus - compact rural van (Side View, facing right) -->

  <!-- REAR WHEEL (smaller) -->
  <g id="rear-wheel">
    <circle cx="48" cy="68" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="48" cy="68" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="48" cy="68" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="48" cy="68" r="5.5" fill="#ecf0f1"/>
    <circle cx="48" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL (smaller) -->
  <g id="front-wheel">
    <circle cx="116" cy="68" r="12.5" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="116" cy="68" r="11" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2.5,2"/>
    <circle cx="116" cy="68" r="8" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="116" cy="68" r="5.5" fill="#ecf0f1"/>
    <circle cx="116" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- UNDERBODY CHASSIS -->
  <rect x="26" y="55" width="112" height="6" rx="2" fill="#1b2631"/>

  <!-- COMPACT VAN BODY (shorter, faded blue) -->
  <path d="M 32 24 L 104 24 Q 108 24 110 20 L 122 20 Q 132 20 138 28 L 142 36 Q 144 40 144 46 L 144 54 Q 144 57 140 57 L 32 57 Q 28 57 28 53 L 28 28 Q 28 24 32 24 Z" fill="#5499c7" stroke="#2e86c1" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 33 57 A 16 16 0 0 1 63 57 Z" fill="#1b2631"/>
  <path d="M 101 57 A 16 16 0 0 1 131 57 Z" fill="#1b2631"/>

  <!-- WINDSHIELD + CAB WINDOW -->
  <path d="M 112 26 L 130 26 Q 136 27 139 33 L 141 38 L 112 38 Z" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- MULTIPLE SMALL SIDE WINDOWS -->
  <rect x="36" y="28" width="14" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="54" y="28" width="14" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="72" y="28" width="14" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>
  <rect x="90" y="28" width="14" height="10" rx="1.5" fill="#aed6f1" stroke="#2c3e50" stroke-width="1"/>

  <!-- RUST/DUST WEATHERING PATCHES -->
  <rect x="30" y="46" width="14" height="5" rx="1" fill="#7fb3d5" opacity="0.7"/>
  <rect x="94" y="48" width="18" height="4" rx="1" fill="#7fb3d5" opacity="0.6"/>

  <!-- SIDE DOOR SEAM -->
  <line x1="86" y1="24" x2="86" y2="56" stroke="#2e86c1" stroke-width="1.2"/>
  <rect x="80" y="42" width="4" height="6" rx="1" fill="#2c3e50"/>

  <!-- ROOF RACK (light) -->
  <line x1="38" y1="20" x2="102" y2="20" stroke="#7f8c8d" stroke-width="2"/>
  <rect x="46" y="15" width="16" height="4.5" rx="1" fill="#8d6e63"/>
  <rect x="68" y="16" width="12" height="3.5" rx="1" fill="#a1887f"/>

  <!-- HEADLIGHT + BUMPER -->
  <circle cx="140" cy="44" r="3" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="130" y="52" width="16" height="4" rx="1.5" fill="#566573"/>
</svg>
