<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Village Utility Cart - simple rural transport cart (Side View, facing right) -->

  <!-- LARGE WOOD-SPOKED WHEELS -->
  <g id="rear-wheel">
    <circle cx="40" cy="66" r="17" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="66" r="15" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="40" cy="66" r="11" fill="#8d6e4a" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="40" y1="56" x2="40" y2="76" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="30" y1="66" x2="50" y2="66" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="33" y1="59" x2="47" y2="73" stroke="#5d4a30" stroke-width="1.2"/>
    <line x1="47" y1="59" x2="33" y2="73" stroke="#5d4a30" stroke-width="1.2"/>
    <circle cx="40" cy="66" r="4" fill="#2c3e50"/>
  </g>

  <g id="front-wheel">
    <circle cx="118" cy="66" r="17" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="66" r="15" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="66" r="11" fill="#8d6e4a" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="118" y1="56" x2="118" y2="76" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="108" y1="66" x2="128" y2="66" stroke="#5d4a30" stroke-width="1.5"/>
    <line x1="111" y1="59" x2="125" y2="73" stroke="#5d4a30" stroke-width="1.2"/>
    <line x1="125" y1="59" x2="111" y2="73" stroke="#5d4a30" stroke-width="1.2"/>
    <circle cx="118" cy="66" r="4" fill="#2c3e50"/>
  </g>

  <!-- AXLE BEAM -->
  <rect x="36" y="63" width="86" height="5" rx="2" fill="#4a3b26"/>

  <!-- WOODEN CART BED (planks) -->
  <rect x="22" y="46" width="112" height="12" fill="#b98e5a" stroke="#7a5c34" stroke-width="1.5"/>
  <line x1="48" y1="46" x2="48" y2="58" stroke="#7a5c34" stroke-width="1"/>
  <line x1="74" y1="46" x2="74" y2="58" stroke="#7a5c34" stroke-width="1"/>
  <line x1="100" y1="46" x2="100" y2="58" stroke="#7a5c34" stroke-width="1"/>

  <!-- LOW SLATTED SIDE RAILS -->
  <rect x="24" y="34" width="76" height="12" fill="none" stroke="#7a5c34" stroke-width="2"/>
  <line x1="40" y1="34" x2="40" y2="46" stroke="#7a5c34" stroke-width="1.5"/>
  <line x1="56" y1="34" x2="56" y2="46" stroke="#7a5c34" stroke-width="1.5"/>
  <line x1="72" y1="34" x2="72" y2="46" stroke="#7a5c34" stroke-width="1.5"/>
  <line x1="88" y1="34" x2="88" y2="46" stroke="#7a5c34" stroke-width="1.5"/>

  <!-- CARGO: SACK + BUNDLE IN BED -->
  <ellipse cx="36" cy="31" rx="8" ry="5" fill="#b9855c" stroke="#8d6e4a" stroke-width="1"/>
  <rect x="52" y="29" width="22" height="5" rx="2" fill="#a97950" stroke="#8d6e4a" stroke-width="1"/>

  <!-- DRIVER BENCH + BACKREST -->
  <rect x="106" y="38" width="22" height="8" rx="2" fill="#7a5c34" stroke="#5d4a30" stroke-width="1"/>
  <rect x="124" y="28" width="5" height="18" rx="1.5" fill="#7a5c34" stroke="#5d4a30" stroke-width="1"/>

  <!-- TILLER STEERING -->
  <line x1="134" y1="34" x2="142" y2="42" stroke="#4a3b26" stroke-width="3" stroke-linecap="round"/>
  <rect x="138" y="30" width="9" height="4.5" rx="2" fill="#4a3b26"/>

  <!-- HITCH BAR (front) -->
  <line x1="134" y1="56" x2="146" y2="60" stroke="#4a3b26" stroke-width="3" stroke-linecap="round"/>
  <circle cx="147" cy="61" r="2.5" fill="none" stroke="#4a3b26" stroke-width="2"/>
</svg>
