<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Cargo Truck - Nepal local-road hauler (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="40" cy="68" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="40" cy="68" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="40" cy="68" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="40" cy="68" r="6.5" fill="#ecf0f1"/>
    <circle cx="40" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="122" cy="68" r="14" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="122" cy="68" r="12.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="122" cy="68" r="9" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="122" cy="68" r="6.5" fill="#ecf0f1"/>
    <circle cx="122" cy="68" r="3" fill="#2c3e50"/>
  </g>

  <!-- CHASSIS RAIL -->
  <rect x="12" y="56" width="140" height="6" rx="2" fill="#1b2631"/>

  <!-- CARGO BOX (weathered blue-grey with rib lines) -->
  <rect x="12" y="16" width="88" height="40" rx="2" fill="#5d6d7e" stroke="#34495e" stroke-width="1.5"/>
  <line x1="30" y1="18" x2="30" y2="54" stroke="#34495e" stroke-width="1"/>
  <line x1="48" y1="18" x2="48" y2="54" stroke="#34495e" stroke-width="1"/>
  <line x1="66" y1="18" x2="66" y2="54" stroke="#34495e" stroke-width="1"/>
  <line x1="84" y1="18" x2="84" y2="54" stroke="#34495e" stroke-width="1"/>
  <rect x="12" y="46" width="88" height="4" fill="#46576a"/>

  <!-- WHEEL ARCH OVER REAR WHEEL -->
  <path d="M 22 56 A 18 18 0 0 1 58 56 Z" fill="#1b2631"/>

  <!-- CAB (front, dusty orange) -->
  <path d="M 104 28 L 138 28 Q 146 28 149 35 L 152 44 L 152 54 Q 152 56 150 56 L 104 56 Z" fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
  <path d="M 110 33 L 134 33 Q 140 33 142 38 L 144 42 L 110 42 Z" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>

  <!-- DOOR LINE + HANDLE -->
  <line x1="128" y1="30" x2="128" y2="55" stroke="#a04000" stroke-width="1.2"/>
  <rect x="131" y="45" width="4" height="2.5" rx="1" fill="#2c3e50"/>

  <!-- FRONT BUMPER, GRILLE & HEADLIGHT -->
  <rect x="146" y="46" width="6" height="9" rx="1.5" fill="#566573"/>
  <rect x="147" y="38" width="5" height="6" rx="1" fill="#2c3e50"/>
  <circle cx="150" cy="50" r="2.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>

  <!-- EXHAUST STACK BEHIND CAB -->
  <rect x="98" y="14" width="4" height="42" fill="#7f8c8d" stroke="#34495e" stroke-width="0.5"/>
  <path d="M 96 14 L 104 12 L 100 14 Z" fill="#2c3e50"/>
</svg>
