<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- School Bus - Nepal school route (Side View, facing right) -->

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="42" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="42" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="42" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="42" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="42" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="68" r="15" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="118" cy="68" r="13.5" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="118" cy="68" r="9.5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="118" cy="68" r="7" fill="#ecf0f1"/>
    <circle cx="118" cy="68" r="3.5" fill="#2c3e50"/>
    <circle cx="118" cy="68" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- UNDERBODY CHASSIS -->
  <rect x="15" y="55" width="130" height="6" rx="2" fill="#1b2631"/>

  <!-- MAIN BODY SHELL (school-bus yellow, hood-nose front) -->
  <path d="M 12 18 L 118 18 L 118 57 L 12 57 Z" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <path d="M 118 22 L 146 28 Q 152 30 152 36 L 152 52 Q 152 57 147 57 L 118 57 Z" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>

  <!-- WHEEL ARCH CUTOUTS -->
  <path d="M 24 57 A 18 18 0 0 1 60 57 Z" fill="#1b2631"/>
  <path d="M 100 57 A 18 18 0 0 1 136 57 Z" fill="#1b2631"/>

  <!-- BLACK STRIPE BELOW WINDOWS -->
  <rect x="12" y="36" width="106" height="5" fill="#2c3e50"/>
  <rect x="118" y="38" width="34" height="5" fill="#2c3e50"/>

  <!-- PASSENGER WINDOWS (grid) -->
  <rect x="18" y="23" width="16" height="11" rx="1.5" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="38" y="23" width="16" height="11" rx="1.5" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="58" y="23" width="16" height="11" rx="1.5" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="78" y="23" width="16" height="11" rx="1.5" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>
  <rect x="98" y="23" width="14" height="11" rx="1.5" fill="#85c1e9" stroke="#2c3e50" stroke-width="1"/>

  <!-- DOOR -->
  <rect x="116" y="26" width="12" height="31" rx="1" fill="#d5a021" stroke="#b7950b" stroke-width="1"/>
  <line x1="122" y1="26" x2="122" y2="57" stroke="#b7950b" stroke-width="1"/>

  <!-- FRONT HOOD DETAIL -->
  <path d="M 122 44 L 146 46 L 146 52 L 122 52 Z" fill="#d5a021"/>

  <!-- HEADLIGHT & BUMPER -->
  <circle cx="147" cy="46" r="3.5" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="118" y="54" width="34" height="4" rx="1.5" fill="#566573"/>

  <!-- ROOF WARNING LIGHTS -->
  <rect x="26" y="13" width="10" height="4" rx="1.5" fill="#e74c3c"/>
  <rect x="96" y="13" width="10" height="4" rx="1.5" fill="#e74c3c"/>
</svg>
