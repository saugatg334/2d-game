<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Rural Nepali Farm Tractor Body (Side View, facing right) -->
  <!-- Heavy Chassis Frame -->
  <rect x="25" y="52" width="110" height="10" rx="2" fill="#2c3e50"/>
  <!-- Front High Engine Hood -->
  <path d="M 75 52 L 75 25 L 130 25 L 132 52 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 80 30 L 125 30 L 125 38 L 80 38 Z" fill="#b03a2e"/>
  <!-- Vertical Exhaust Stack with Rain Cap -->
  <rect x="115" y="8" width="4" height="18" fill="#7f8c8d"/>
  <path d="M 113 8 L 121 6 L 117 8 Z" fill="#34495e"/>
  <!-- Steering Wheel & Dashboard -->
  <line x1="72" y1="36" x2="62" y2="24" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="60" cy="22" r="5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Driver Seat -->
  <path d="M 46 38 L 58 38 L 56 46 L 44 46 Z" fill="#d35400" stroke="#a04000" stroke-width="1"/>
  <!-- Large Rear Curved Mudguard -->
  <path d="M 22 55 A 25 25 0 0 1 65 42 L 68 55 Z" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <!-- Front Small Fender -->
  <path d="M 108 44 Q 124 40 132 50 L 124 52 Z" fill="#c0392b"/>
  <!-- Front Headlight & Front Grille -->
  <circle cx="131" cy="32" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="128" y="38" width="4" height="10" fill="#7f8c8d"/>
</svg>
