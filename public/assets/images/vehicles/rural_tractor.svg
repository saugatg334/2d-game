<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Rural Nepali Farm Tractor Body & Wheels (Side View, facing right) -->

  <!-- LARGE REAR TRACTOR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="60" r="22" fill="#1a1a1a" stroke="#000000" stroke-width="2"/>
    <!-- Heavy Tractor Tread Pattern -->
    <circle cx="42" cy="60" r="20" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="5,4"/>
    <circle cx="42" cy="60" r="14" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1.5"/>
    <circle cx="42" cy="60" r="9" fill="#7f8c8d"/>
    <circle cx="42" cy="60" r="4" fill="#2c3e50"/>
    <path d="M 42 46 L 42 74 M 28 60 L 56 60 M 32 50 L 52 70 M 32 70 L 52 50" stroke="#f39c12" stroke-width="1.5"/>
  </g>

  <!-- SMALLER FRONT TRACTOR WHEEL -->
  <g id="front-wheel">
    <circle cx="122" cy="68" r="12" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
    <circle cx="122" cy="68" r="11" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="122" cy="68" r="7.5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
    <circle cx="122" cy="68" r="4.5" fill="#7f8c8d"/>
    <circle cx="122" cy="68" r="2.5" fill="#2c3e50"/>
    <path d="M 122 60.5 L 122 75.5 M 114.5 68 L 129.5 68" stroke="#f39c12" stroke-width="1"/>
  </g>

  <!-- HEAVY CHASSIS FRAME -->
  <rect x="25" y="52" width="105" height="9" rx="2" fill="#2c3e50"/>

  <!-- REAR CURVED MUDGUARD OVER LARGE REAR WHEEL -->
  <path d="M 18 58 A 25 25 0 0 1 66 42 L 68 58 Z" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>

  <!-- FRONT ENGINE HOOD (Bold Red) -->
  <path d="M 72 52 L 72 26 L 132 26 L 134 52 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 78 30 L 128 30 L 128 38 L 78 38 Z" fill="#b03a2e"/>

  <!-- VERTICAL EXHAUST STACK WITH RAIN CAP -->
  <rect x="116" y="8" width="4" height="18" fill="#7f8c8d" stroke="#34495e" stroke-width="0.5"/>
  <path d="M 114 8 L 122 6 L 118 8 Z" fill="#2c3e50"/>

  <!-- STEERING WHEEL & DASHBOARD -->
  <line x1="70" y1="36" x2="60" y2="24" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="58" cy="22" r="5" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- DRIVER SEAT -->
  <path d="M 44 38 L 56 38 L 54 46 L 42 46 Z" fill="#d35400" stroke="#a04000" stroke-width="1"/>

  <!-- FRONT HEADLIGHT & GRILLE -->
  <circle cx="133" cy="32" r="4" fill="#f1c40f" stroke="#ffffff" stroke-width="1"/>
  <rect x="130" y="38" width="4" height="10" fill="#7f8c8d"/>
</svg>
