<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Himalayan Mountain Bike Body & Wheels (Side View, facing right) -->
  
  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="42" cy="66" r="14" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="42" cy="66" r="13" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="42" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="42" cy="66" r="7" fill="#7f8c8d"/>
    <circle cx="42" cy="66" r="3" fill="#2c3e50"/>
    <line x1="42" y1="57" x2="42" y2="75" stroke="#95a5a6" stroke-width="1"/>
    <line x1="33" y1="66" x2="51" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="118" cy="66" r="14" fill="#1a1a1a" stroke="#111111" stroke-width="1.5"/>
    <circle cx="118" cy="66" r="13" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="118" cy="66" r="9" fill="#bdc3c7"/>
    <circle cx="118" cy="66" r="7" fill="#7f8c8d"/>
    <circle cx="118" cy="66" r="3" fill="#2c3e50"/>
    <line x1="118" y1="57" x2="118" y2="75" stroke="#95a5a6" stroke-width="1"/>
    <line x1="109" y1="66" x2="127" y2="66" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- SWINGARM & FRONT FORKS -->
  <line x1="42" y1="66" x2="68" y2="52" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="94" y1="36" x2="118" y2="66" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="97" y1="36" x2="119" y2="64" stroke="#d5dbdb" stroke-width="2" stroke-linecap="round"/>

  <!-- ENGINE BLOCK & EXHAUST -->
  <rect x="60" y="44" width="22" height="16" rx="3" fill="#34495e" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="71" cy="52" r="4.5" fill="#7f8c8d"/>
  <path d="M 68 54 Q 52 56 36 48 L 28 44" stroke="#d35400" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="24" y="40" width="18" height="7" rx="2" fill="#7f8c8d" stroke="#333333" stroke-width="1" transform="rotate(-15 33 43)"/>

  <!-- MAIN CHASSIS FRAME -->
  <path d="M 45 46 L 70 44 L 92 35 L 72 35 Z" fill="#2c3e50"/>

  <!-- FUEL TANK (Himalayan Blue) -->
  <path d="M 66 35 Q 80 23 98 33 L 94 44 L 64 42 Z" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
  <path d="M 72 30 Q 82 27 92 33" stroke="#5dade2" stroke-width="2" fill="none"/>
  <path d="M 80 34 L 84 28 L 88 34 Z" fill="#ffffff"/> <!-- Mountain emblem -->

  <!-- SEAT -->
  <path d="M 38 34 Q 52 32 66 40 L 62 45 L 38 40 Z" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>

  <!-- REAR FENDER -->
  <path d="M 30 38 L 44 40 L 32 50 Z" fill="#2980b9"/>

  <!-- HIGH FRONT FENDER / BEAK -->
  <path d="M 94 36 Q 116 36 126 44 L 106 44 Z" fill="#2980b9" stroke="#1b4f72" stroke-width="1"/>

  <!-- HANDLEBARS & HEADLIGHT -->
  <line x1="94" y1="35" x2="104" y2="20" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <rect x="98" y="18" width="12" height="4" rx="1.5" fill="#e74c3c"/>
  <circle cx="107" cy="28" r="5" fill="#f1c40f" stroke="#ffffff" stroke-width="1.5"/>
</svg>
