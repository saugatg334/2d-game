<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90" viewBox="0 0 160 90">
  <!-- Himalayan Mountain Bike Body (Side View, facing right) -->
  <!-- Main Frame & Engine Block -->
  <path d="M 45 55 L 75 55 L 85 42 L 65 38 Z" fill="#2c3e50" />
  <rect x="52" y="44" width="22" height="15" rx="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1.5"/>
  <circle cx="63" cy="51.5" r="4" fill="#95a5a6"/>
  <!-- Fuel Tank -->
  <path d="M 60 38 Q 75 28 95 36 L 90 46 L 62 45 Z" fill="#2980b9" stroke="#1f618d" stroke-width="1.5"/>
  <path d="M 68 34 Q 78 30 88 36" stroke="#5dade2" stroke-width="2" fill="none"/>
  <!-- Seat -->
  <path d="M 38 38 Q 48 37 62 42 L 58 48 L 38 43 Z" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <!-- Rear Fender / Frame Tail -->
  <path d="M 32 40 L 44 42 L 36 50 Z" fill="#2980b9"/>
  <!-- Front Suspension Fork & Handlebars -->
  <line x1="85" y1="42" x2="115" y2="65" stroke="#7f8c8d" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="36" x2="98" y2="24" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <rect x="94" y="22" width="10" height="4" rx="1" fill="#e74c3c"/>
  <circle cx="102" cy="30" r="4" fill="#f1c40f"/>
  <!-- High Front Beak / Fender -->
  <path d="M 88 38 Q 110 38 120 45 L 100 45 Z" fill="#2980b9"/>
  <!-- High Exhaust Pipe -->
  <path d="M 65 52 L 45 48 L 30 40" stroke="#d35400" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <rect x="26" y="36" width="18" height="6" rx="2" fill="#7f8c8d" transform="rotate(-20 35 39)"/>
  <!-- Nepal Mountain Logo Decal -->
  <path d="M 75 40 L 80 34 L 85 40 Z" fill="#ffffff"/>
</svg>
