<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Muglin Road - road hugging a steep river gorge with a bridge span -->

  <rect width="170" height="62" fill="#9fd8cb"/>
  <!-- dense jungle hills -->
  <ellipse cx="36" cy="34" rx="62" ry="11" fill="#1e6b52"/>
  <ellipse cx="140" cy="36" rx="62" ry="12" fill="#177a56"/>
  <ellipse cx="86" cy="30" rx="52" ry="7" fill="#22885f"/>
  <!-- steep gorge walls -->
  <polygon points="0,36 52,42 34,62 0,62" fill="#14503c"/>
  <polygon points="170,38 116,44 136,62 170,62" fill="#0f4a37"/>
  <!-- river at the gorge bottom -->
  <path d="M 30 62 Q 70 52 92 56 Q 116 60 150 56 L 170 58 L 170 62 Z" fill="#4fa8c7"/>
  <path d="M 44 59 Q 84 53.5 112 57" stroke="#a5d8e8" fill="none" stroke-width="1.3"/>
  <!-- bridge spanning the gorge -->
  <rect x="58" y="47" width="52" height="2.4" fill="#7d5a44"/>
  <rect x="62" y="49.4" width="2.4" height="9" fill="#5d4037"/>
  <rect x="82" y="49.4" width="2.4" height="9" fill="#5d4037"/>
  <rect x="102" y="49.4" width="2.4" height="9" fill="#5d4037"/>
  <!-- road curving around the hillside -->
  <path d="M 0 52 Q 24 48 40 43 Q 56 38.5 88 37.5 Q 124 36.5 170 35 L 170 40 Q 126 41.5 92 42.5 Q 62 43.5 48 48 Q 34 53 0 58 Z" fill="#5c6a62"/>
  <path d="M 8 53 Q 30 49 46 44.5" stroke="#f1c40f" stroke-width="1.2" fill="none" stroke-dasharray="5,4"/>
  <path d="M 96 39.5 Q 132 38.5 168 37.2" stroke="#f1c40f" stroke-width="1.2" fill="none" stroke-dasharray="5,4"/>
  <!-- dense roadside greenery -->
  <circle cx="14" cy="44" r="3.6" fill="#0e4d38"/>
  <circle cx="70" cy="35.5" r="3.4" fill="#0e4d38"/>
  <circle cx="120" cy="34" r="3.2" fill="#0e4d38"/>
  <circle cx="156" cy="32.5" r="3" fill="#0e4d38"/>
</svg>
