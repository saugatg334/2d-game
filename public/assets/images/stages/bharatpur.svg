<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Bharatpur Roads - lowland city street with vehicles and roadside greenery -->

  <rect width="170" height="62" fill="#bde3f2"/>
  <!-- flat Terai horizon -->
  <rect x="0" y="34" width="170" height="3" fill="#c9d8b0"/>
  <!-- low-rise city buildings -->
  <rect x="6" y="22" width="16" height="13" fill="#c9b8a0"/>
  <rect x="9" y="25" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="15" y="25" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="26" y="18" width="14" height="17" fill="#b8a488"/>
  <rect x="29" y="21" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="34" y="21" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="44" y="24" width="12" height="11" fill="#a89880"/>
  <rect x="128" y="23" width="14" height="12" fill="#b8a488"/>
  <rect x="146" y="20" width="16" height="15" fill="#c9b8a0"/>
  <rect x="149" y="23" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="155" y="23" width="3" height="3.5" fill="#7a6a55"/>
  <!-- utility poles -->
  <rect x="62" y="17" width="2" height="18" fill="#5d4436"/>
  <rect x="58.5" y="19" width="9" height="1.6" fill="#5d4436"/>
  <rect x="112" y="18" width="2" height="17" fill="#5d4436"/>
  <rect x="108.5" y="20" width="9" height="1.6" fill="#5d4436"/>
  <!-- car silhouettes on the road -->
  <rect x="70" y="41" width="11" height="4.5" fill="#c0392b"/>
  <rect x="72" y="39.5" width="6" height="2.5" fill="#8e2b20"/>
  <circle cx="73" cy="46" r="1.4" fill="#333333"/>
  <circle cx="78" cy="46" r="1.4" fill="#333333"/>
  <rect x="94" y="42" width="10" height="4" fill="#d8a02c"/>
  <circle cx="96.5" cy="46.5" r="1.4" fill="#333333"/>
  <circle cx="101" cy="46.5" r="1.4" fill="#333333"/>
  <!-- roadside trees -->
  <circle cx="88" cy="33" r="3.4" fill="#4c8a44"/>
  <rect x="86.5" y="35.5" width="3" height="4" fill="#6d5140"/>
  <circle cx="124" cy="34" r="3" fill="#4c8a44"/>
  <!-- broad city road -->
  <rect x="0" y="47" width="170" height="10" fill="#5a646b"/>
  <rect x="0" y="47" width="170" height="1.6" fill="#8d979e"/>
  <rect x="12" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="56" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="100" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="144" y="51.5" width="14" height="2" fill="#f1c40f"/>
</svg>
