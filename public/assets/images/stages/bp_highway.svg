  <rect x="104" y="40.5" width="66" height="1.6" fill="#ecf0f1"/>
  <rect x="112" y="42" width="1.8" height="3" fill="#b0bec5"/>
  <rect x="132" y="41.6" width="1.8" height="3" fill="#b0bec5"/>
  <rect x="152" y="41.4" width="1.8" height="3" fill="#b0bec5"/>
</svg>
