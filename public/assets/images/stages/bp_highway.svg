  <rect width="170" height="62" fill="#9bd0e8"/>
  <!-- soft distant ridge -->
  <ellipse cx="85" cy="28" rx="100" ry="9" fill="#7fb3d5"/>
  <!-- layered green hills with terraced curves -->
  <ellipse cx="40" cy="38" rx="64" ry="12" fill="#2e8b57"/>
  <path d="M 0 34 Q 20 31 44 34" stroke="#7cb342" fill="none" stroke-width="1.6"/>
  <path d="M 0 39 Q 22 36 48 39" stroke="#66bb6a" fill="none" stroke-width="1.6"/>
  <path d="M 0 44 Q 24 41 52 44" stroke="#7cb342" fill="none" stroke-width="1.6"/>
  <ellipse cx="136" cy="41" rx="62" ry="13" fill="#388e3c"/>
  <path d="M 116 37 Q 140 34 168 38" stroke="#9ccc65" fill="none" stroke-width="1.6"/>
  <path d="M 118 43 Q 142 40 170 44" stroke="#66bb6a" fill="none" stroke-width="1.6"/>
  <!-- smooth modern highway sweeping across -->
  <path d="M 0 58 Q 60 56 96 49 Q 126 43.5 170 43 L 170 50 Q 128 50.5 100 55 Q 62 61 0 62 Z" fill="#5f6c74"/>
