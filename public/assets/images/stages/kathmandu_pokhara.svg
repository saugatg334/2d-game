<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Kathmandu-Pokhara corridor - scenic broad highway through valley and mountains -->

  <rect width="170" height="62" fill="#8fd0f0"/>
  <!-- bright snow mountains framing both sides -->
  <polygon points="0,30 24,8 48,30" fill="#f4f9fd"/>
  <polygon points="122,30 148,9 170,30" fill="#eef6fc"/>
  <polygon points="18,30 40,14 62,30" fill="#dfeef8"/>
  <polygon points="108,30 130,15 152,30" fill="#dfeef8"/>
  <!-- valley green -->
  <ellipse cx="46" cy="38" rx="66" ry="10" fill="#57a05c"/>
  <ellipse cx="130" cy="40" rx="64" ry="11" fill="#4a9155"/>
  <!-- meandering river through the valley -->
  <path d="M 0 47 Q 34 44 58 47 Q 82 50 106 46.5 Q 134 43 170 46" stroke="#69b7dd" stroke-width="3" fill="none"/>
  <!-- small roadside settlement hint -->
  <rect x="30" y="35" width="7" height="5" fill="#c8a27a"/>
  <polygon points="28.5,35 33.5,31.5 38.5,35" fill="#7a5c48"/>
  <rect x="42" y="36" width="5.5" height="4" fill="#b8926b"/>
  <polygon points="40.8,36 44.8,33 48.8,36" fill="#6d5140"/>
  <!-- broad scenic highway in the foreground -->
  <path d="M 0 62 Q 46 58 84 54 Q 126 50 170 49 L 170 56 Q 128 57 90 60 Q 48 63.5 0 62 Z" fill="#61707a"/>
  <path d="M 10 60.5 Q 56 57.5 100 53.5" stroke="#f1c40f" stroke-width="1.3" fill="none" stroke-dasharray="6,5"/>
  <path d="M 128 52.5 Q 150 52 168 51.6" stroke="#f1c40f" stroke-width="1.3" fill="none" stroke-dasharray="5,4"/>
  <!-- roadside trees -->
  <circle cx="70" cy="48.5" r="3.4" fill="#2f7d4f"/>
  <circle cx="120" cy="45" r="3.2" fill="#2f7d4f"/>
</svg>
