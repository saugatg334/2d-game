<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Jomsom Trail - wind-swept dry Kali Gandaki valley with barren rocky slopes -->

  <rect width="170" height="62" fill="#cfd8de"/>
  <!-- dramatic Himalayan peaks in the distance -->
  <polygon points="10,36 34,12 58,36" fill="#f2f6f9"/>
  <polygon points="44,36 68,10 92,36" fill="#e6edf3"/>
  <polygon points="100,36 124,13 148,36" fill="#f2f6f9"/>
  <polygon points="136,36 158,17 178,36" fill="#e0e9f0"/>
  <!-- barren rocky slopes in muted earth tones -->
  <path d="M 0 40 Q 44 36 86 40 L 96 62 L 0 62 Z" fill="#8a7a68"/>
  <path d="M 170 38 Q 130 38 92 42 L 84 62 L 170 62 Z" fill="#968572"/>
  <polygon points="0,40 30,37 40,44 0,46" fill="#7a6b5a"/>
  <polygon points="170,38 142,37 132,45 170,46" fill="#867664"/>
  <!-- wind-swept scree bands -->
  <path d="M 0 50 Q 40 46 84 50" stroke="#6f6152" fill="none" stroke-width="1.6"/>
  <path d="M 170 48 Q 132 46 90 52" stroke="#75675a" fill="none" stroke-width="1.6"/>
  <!-- wide dry valley floor -->
  <path d="M 40 62 Q 66 52 96 50 Q 124 48 148 52 L 170 56 L 170 62 Z" fill="#b3a48c"/>
  <!-- winding dusty mountain road on the valley floor -->
  <path d="M 0 61 Q 44 56 76 54 Q 108 52 136 52.5 Q 154 53 170 54" stroke="#a09078" stroke-width="5" fill="none"/>
  <path d="M 10 60 Q 50 56 82 54" stroke="#e8dcc0" stroke-width="1.1" fill="none" stroke-dasharray="5,4"/>
  <path d="M 116 52.4 Q 144 52.6 168 53.8" stroke="#e8dcc0" stroke-width="1.1" fill="none" stroke-dasharray="4,3"/>
  <!-- sparse hardy shrubs -->
  <circle cx="30" cy="52" r="2.2" fill="#6d7a52"/>
  <circle cx="120" cy="56" r="2.2" fill="#6d7a52"/>
  <circle cx="158" cy="50" r="2" fill="#6d7a52"/>
</svg>
