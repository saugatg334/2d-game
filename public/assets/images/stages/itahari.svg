<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Itahari Junction - major eastern highway crossroads on the flat Terai -->

  <rect width="170" height="62" fill="#bde4f2"/>
  <!-- distant low hills -->
  <ellipse cx="50" cy="32" rx="82" ry="6" fill="#a8c4a8"/>
  <ellipse cx="142" cy="34" rx="56" ry="6.5" fill="#98b498"/>
  <!-- roadside commercial buildings -->
  <rect x="10" y="24" width="16" height="13" fill="#c9b8a0"/>
  <rect x="13" y="27" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="19" y="27" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="30" y="20" width="14" height="17" fill="#b8a488"/>
  <rect x="33" y="23" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="38" y="23" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="48" y="26" width="12" height="11" fill="#a89880"/>
  <rect x="64" y="23" width="13" height="14" fill="#c9b8a0"/>
  <rect x="67" y="26" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="72" y="26" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="136" y="25" width="14" height="12" fill="#b8a488"/>
  <rect x="154" y="22" width="14" height="15" fill="#c9b8a0"/>
  <rect x="157" y="25" width="3" height="3.5" fill="#7a6a55"/>
  <!-- utility poles -->
  <rect x="94" y="17" width="2" height="20" fill="#5d4436"/>
  <rect x="90.5" y="19" width="9" height="1.6" fill="#5d4436"/>
  <rect x="120" y="19" width="2" height="18" fill="#5d4436"/>
  <rect x="116.5" y="21" width="9" height="1.6" fill="#5d4436"/>
  <!-- bus and car at the junction -->
  <rect x="82" y="38" width="16" height="6.5" fill="#3a7ec2"/>
  <rect x="84.5" y="40" width="3.5" height="2.5" fill="#cfe4f4"/>
  <rect x="90" y="40" width="3.5" height="2.5" fill="#cfe4f4"/>
  <circle cx="86" cy="45" r="1.5" fill="#333333"/>
  <circle cx="94" cy="45" r="1.5" fill="#333333"/>
  <rect x="110" y="41.5" width="10" height="4" fill="#c0392b"/>
  <circle cx="112.5" cy="46" r="1.3" fill="#333333"/>
  <circle cx="117" cy="46" r="1.3" fill="#333333"/>
  <!-- main east-west highway -->
  <rect x="0" y="47" width="170" height="10" fill="#5c666e"/>
  <rect x="0" y="47" width="170" height="1.6" fill="#8d979e"/>
  <rect x="14" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="58" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="102" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="146" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <!-- branch road splitting away (junction geometry) -->
  <path d="M 96 62 L 116 50 L 170 42.5 L 170 47 L 122 53.5 L 104 62 Z" fill="#66707a"/>
  <path d="M 118 49.6 Q 144 46 168 43" stroke="#f1c40f" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
</svg>
