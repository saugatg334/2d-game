<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Hetauda Hills - winding climbing road through layered green hills -->

  <rect width="170" height="62" fill="#87ceeb"/>
  <!-- mountain backdrop with snow cap -->
  <polygon points="88,36 114,10 140,36" fill="#708090"/>
  <polygon points="110,36 132,15 154,36" fill="#778899"/>
  <polygon points="107,19 114,12 121,19 114,23" fill="#f0f8ff"/>
  <!-- layered green hills -->
  <ellipse cx="38" cy="38" rx="60" ry="12" fill="#2e8b57"/>
  <ellipse cx="132" cy="43" rx="64" ry="14" fill="#27ae60"/>
  <!-- winding road climbing in an S-curve -->
  <path d="M 0 60 Q 45 60 58 52 Q 72 44 62 40 Q 57 37 74 35.5 L 170 35.5" stroke="#8d6e63" stroke-width="8" fill="none"/>
  <!-- centerline dashes following the curve -->
  <path d="M 8 59.5 Q 44 59.5 56 52" stroke="#f1c40f" stroke-width="1.4" fill="none" stroke-dasharray="5,4"/>
  <path d="M 66 45 Q 60 41 68 38" stroke="#f1c40f" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <!-- roadside posts -->
  <rect x="30" y="53" width="2" height="5" fill="#ecf0f1"/>
  <rect x="52" y="45" width="2" height="5" fill="#ecf0f1"/>
  <rect x="100" y="30.5" width="2" height="5" fill="#ecf0f1"/>
  <!-- hillside trees -->
  <circle cx="14" cy="46" r="4" fill="#1e8449"/>
  <circle cx="146" cy="48" r="4.5" fill="#1e8449"/>
  <circle cx="158" cy="50" r="3.5" fill="#27ae60"/>
</svg>
