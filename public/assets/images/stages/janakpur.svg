<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Janakpur Roads - Terai city with distinctive temple-tower architecture -->

  <rect width="170" height="62" fill="#c2e6f5"/>
  <!-- flat plains horizon -->
  <rect x="0" y="35" width="170" height="3" fill="#d8cba8"/>
  <!-- large multi-tier temple tower silhouette (geometric, no lettering) -->
  <polygon points="86,35 96,24 106,35" fill="#b0885a"/>
  <polygon points="83,35 96,20 109,35" fill="#c09a6a" opacity="0.9"/>
  <polygon points="88,20 96,13 104,20" fill="#b0885a"/>
  <rect x="93" y="10.5" width="6" height="4" fill="#9a7848"/>
  <polygon points="92,10.5 96,7.5 100,10.5" fill="#8a6a3e"/>
  <!-- low-rise city buildings beside the temple -->
  <rect x="8" y="24" width="15" height="12" fill="#c9b8a0"/>
  <rect x="11" y="27" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="16" y="27" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="27" y="26" width="13" height="10" fill="#b8a488"/>
  <rect x="46" y="23" width="12" height="13" fill="#a89880"/>
  <rect x="120" y="25" width="14" height="11" fill="#c9b8a0"/>
  <rect x="140" y="22" width="13" height="14" fill="#b8a488"/>
  <rect x="143" y="25" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="148" y="25" width="3" height="3.5" fill="#7a6a55"/>
  <!-- arched gateway hint between buildings -->
  <rect x="66" y="28" width="14" height="8" fill="#d8c8a8"/>
  <path d="M 69 36 L 69 31 Q 73 27.5 77 31 L 77 36 Z" fill="#a08868"/>
  <!-- rickshaw silhouette for urban traffic feeling -->
  <rect x="42" y="41.5" width="8" height="4" fill="#2e7d5a"/>
  <rect x="46" y="39.5" width="3.5" height="2.5" fill="#1e6b4a"/>
  <circle cx="44" cy="46" r="1.3" fill="#333333"/>
  <circle cx="48.5" cy="46" r="1.3" fill="#333333"/>
  <!-- roadside trees -->
  <circle cx="116" cy="34" r="3.2" fill="#4c8a44"/>
  <rect x="114.5" y="36.5" width="3" height="4" fill="#6d5140"/>
  <!-- broad city road -->
  <rect x="0" y="47" width="170" height="10" fill="#5f6a72"/>
  <rect x="0" y="47" width="170" height="1.5" fill="#95a0a8"/>
  <rect x="14" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="58" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="102" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="146" y="51.5" width="14" height="2" fill="#f1c40f"/>
</svg>
