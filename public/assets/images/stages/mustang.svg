<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Mustang Desert Road - dramatic layered barren cliffs above a deep high valley -->

  <rect width="170" height="62" fill="#bfe0ee"/>
  <!-- distant snow-covered mountains -->
  <polygon points="20,32 42,13 64,32" fill="#eef5fa"/>
  <polygon points="52,32 74,11 96,32" fill="#e2ecf4"/>
  <polygon points="110,32 132,14 154,32" fill="#eef5fa"/>
  <!-- dramatic layered barren cliffs in warm ochre tones -->
  <path d="M 0 34 L 26 30 L 34 36 L 44 31 L 54 38 L 54 62 L 0 62 Z" fill="#b08a52"/>
  <path d="M 0 34 L 26 30 L 32 35 L 24 39 L 0 42 Z" fill="#c49a5e"/>
  <path d="M 170 32 L 140 29 L 130 36 L 120 30 L 112 38 L 112 62 L 170 62 Z" fill="#a87e48"/>
  <path d="M 170 32 L 140 29 L 134 35 L 144 40 L 170 42 Z" fill="#bd9258"/>
  <path d="M 0 46 Q 24 43 44 47" stroke="#8a6a3e" fill="none" stroke-width="1.6"/>
  <path d="M 122 46 Q 146 43 170 46" stroke="#8a6a3e" fill="none" stroke-width="1.6"/>
  <!-- deep valley floor -->
  <path d="M 48 62 Q 70 50 94 48 Q 118 47 136 52 L 148 62 Z" fill="#c9a86e"/>
  <!-- traditional mountain house cluster -->
  <rect x="118" y="44" width="9" height="6" fill="#d8cdb8"/>
  <polygon points="117,44 122.5,40.5 128,44" fill="#8a6a3e"/>
  <rect x="129" y="45.5" width="8" height="5" fill="#cfc2aa"/>
  <rect x="132" y="47.5" width="2.4" height="3" fill="#6d5140"/>
  <!-- winding road along the cliff base -->
  <path d="M 0 58 Q 30 56 52 55 Q 78 54 100 52.5 Q 122 51.5 144 52.5 Q 158 53.5 170 54.5" stroke="#a89578" stroke-width="4.6" fill="none"/>
  <path d="M 10 57.4 Q 40 55.8 66 54.6" stroke="#eadfc4" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M 118 51.6 Q 142 52 166 54" stroke="#eadfc4" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <!-- sparse high-altitude shrubs -->
  <circle cx="60" cy="53" r="2" fill="#7d7a4e"/>
  <circle cx="104" cy="50" r="2" fill="#7d7a4e"/>
</svg>
