<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Khokana Village Road - Newari heritage village in Kathmandu Valley -->

  <rect width="170" height="62" fill="#87ceeb"/>
  <!-- green valley hills -->
  <ellipse cx="38" cy="34" rx="62" ry="12" fill="#4a7c59"/>
  <ellipse cx="142" cy="37" rx="56" ry="13" fill="#6b8e23"/>
  <!-- terraced field bands on left hill -->
  <path d="M 0 32 Q 18 28 38 32" stroke="#228b22" fill="none" stroke-width="2"/>
  <path d="M 0 38 Q 20 34 40 38" stroke="#32cd32" fill="none" stroke-width="2"/>
  <path d="M 0 44 Q 22 40 42 44" stroke="#6b8e23" fill="none" stroke-width="2"/>
  <!-- traditional Newari houses (brick + dark roofs) -->
  <rect x="54" y="30" width="15" height="11" fill="#a0522d"/>
  <polygon points="52,30 61.5,23 71,30" fill="#5d4037"/>
  <rect x="58" y="34" width="3" height="4" fill="#5d4037"/>
  <rect x="76" y="28" width="13" height="13" fill="#8d6e63"/>
  <polygon points="74,28 82.5,20 91,28" fill="#4e342e"/>
  <rect x="80" y="33" width="3" height="4" fill="#4e342e"/>
  <rect x="95" y="32" width="10" height="9" fill="#a1887f"/>
  <polygon points="93.5,32 100,26.5 106.5,32" fill="#5d4037"/>
  <!-- earthy rural road -->
  <path d="M 0 62 Q 55 46 170 51 L 170 62 Z" fill="#a07850"/>
  <path d="M 20 57 Q 80 50 150 54" stroke="#8d6e4a" fill="none" stroke-width="1.5"/>
  <!-- roadside tree -->
  <circle cx="128" cy="42" r="4.5" fill="#27ae60"/>
  <rect x="126.5" y="44" width="3" height="5" fill="#5d4037"/>
</svg>
