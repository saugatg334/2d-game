<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Biratnagar Streets - industrial Terai city with factories and cargo trucks -->

  <rect width="170" height="62" fill="#b5ddef"/>
  <!-- distant low hills on the eastern horizon -->
  <ellipse cx="60" cy="33" rx="80" ry="5.5" fill="#a8c4b0"/>
  <ellipse cx="146" cy="34" rx="54" ry="6" fill="#98b6a2"/>
  <!-- factory silhouettes with sawtooth roofs -->
  <rect x="8" y="26" width="26" height="11" fill="#8d9aa5"/>
  <polygon points="8,26 14,21.5 20,26 26,21.5 32,26" fill="#7a8894"/>
  <rect x="40" y="23" width="20" height="14" fill="#9aa8b3"/>
  <rect x="46" y="14" width="4" height="10" fill="#7a8894"/>
  <rect x="66" y="27" width="22" height="10" fill="#8d9aa5"/>
  <polygon points="66,27 73,22 80,27 87,22 94,27" fill="#7a8894"/>
  <!-- warehouse row on the right -->
  <rect x="112" y="25" width="18" height="12" fill="#a0aeb8"/>
  <polygon points="110.5,25 121,18.5 131.5,25" fill="#8d9aa5"/>
  <rect x="136" y="27" width="24" height="10" fill="#98a6b0"/>
  <!-- utility poles with crossarms -->
  <rect x="103" y="16" width="2" height="19" fill="#5d4436"/>
  <rect x="99.5" y="18" width="9" height="1.6" fill="#5d4436"/>
  <rect x="108" y="20.5" width="9" height="1.6" fill="#5d4436"/>
  <!-- cargo trucks on the road -->
  <rect x="26" y="40" width="15" height="6" fill="#4a5fa5"/>
  <rect x="40" y="42" width="6" height="4" fill="#d8d8d8"/>
  <circle cx="30" cy="46.5" r="1.6" fill="#333333"/>
  <circle cx="36" cy="46.5" r="1.6" fill="#333333"/>
  <circle cx="43" cy="46.5" r="1.6" fill="#333333"/>
  <rect x="86" y="41" width="12" height="5" fill="#c07830"/>
  <rect x="97" y="42.5" width="5" height="3.5" fill="#d8d8d8"/>
  <circle cx="89" cy="46.8" r="1.5" fill="#333333"/>
  <circle cx="94" cy="46.8" r="1.5" fill="#333333"/>
  <!-- broad flat industrial highway -->
  <rect x="0" y="47" width="170" height="10" fill="#58626a"/>
  <rect x="0" y="47" width="170" height="1.6" fill="#8a959d"/>
  <rect x="12" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="56" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="100" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="144" y="51.5" width="14" height="2" fill="#f1c40f"/>
</svg>
