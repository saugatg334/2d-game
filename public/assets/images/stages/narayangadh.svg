<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Narayangadh Highway - broad Terai river crossing with long bridge over the Narayani -->

  <rect width="170" height="62" fill="#b5e3f5"/>
  <!-- distant low hills -->
  <ellipse cx="46" cy="33" rx="80" ry="6" fill="#a8c99a"/>
  <ellipse cx="140" cy="35" rx="62" ry="7" fill="#98ba8c"/>
  <!-- green riverbank vegetation -->
  <rect x="0" y="38" width="170" height="5" fill="#6fae5c"/>
  <!-- broad Narayani river band -->
  <path d="M 0 47 Q 50 43.5 90 45.5 Q 130 47.5 170 44.5 L 170 53 Q 128 55.5 88 53.5 Q 48 51.5 0 55 Z" fill="#4f9fd8"/>
  <path d="M 12 50 Q 70 47 130 49.5" stroke="#8ec8ec" fill="none" stroke-width="1.4"/>
  <!-- long multi-span bridge crossing the river -->
  <rect x="0" y="41.5" width="170" height="2.4" fill="#8d8578"/>
  <rect x="10" y="43.9" width="2.6" height="11" fill="#6d675c"/>
  <rect x="42" y="43.9" width="2.6" height="11" fill="#6d675c"/>
  <rect x="74" y="43.9" width="2.6" height="11" fill="#6d675c"/>
  <rect x="106" y="43.9" width="2.6" height="11" fill="#6d675c"/>
  <rect x="138" y="43.9" width="2.6" height="11" fill="#6d675c"/>
  <!-- highway approaching the bridge from the foreground -->
  <path d="M 0 61 Q 56 57.5 104 55 Q 140 53 170 52" stroke="#5f6a70" stroke-width="6" fill="none"/>
  <path d="M 10 60.2 Q 60 57.2 110 55" stroke="#f1c40f" stroke-width="1.2" fill="none" stroke-dasharray="5,4"/>
  <!-- riverside trees -->
  <circle cx="30" cy="39.5" r="3.2" fill="#3d8b4f"/>
  <circle cx="152" cy="40" r="3.2" fill="#3d8b4f"/>
</svg>
