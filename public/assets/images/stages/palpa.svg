<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Palpa Ridge - high ridge road with deep valley and steep terraced descent -->

  <rect width="170" height="62" fill="#88c7e8"/>
  <!-- distant mountains -->
  <polygon points="14,32 36,12 58,32" fill="#dfeef8"/>
  <polygon points="120,32 142,13 164,32" fill="#d5e8f4"/>
  <!-- high ridge carrying the road -->
  <path d="M 0 36 Q 44 30 86 31 Q 128 32 170 35" stroke="#5c8a52" stroke-width="13" fill="none"/>
  <!-- steep terraced slope descending into a deep valley -->
  <path d="M 0 43 Q 40 38 80 40 Q 120 42 170 41 L 170 62 L 0 62 Z" fill="#3f7d50"/>
  <path d="M 6 49 Q 48 44 90 46" stroke="#8bc34a" fill="none" stroke-width="1.6"/>
  <path d="M 2 55 Q 46 50 92 52" stroke="#aed581" fill="none" stroke-width="1.6"/>
  <path d="M 100 48 Q 136 45 170 47" stroke="#8bc34a" fill="none" stroke-width="1.6"/>
  <!-- river hint at the valley bottom -->
  <path d="M 0 60 Q 50 56 100 58 Q 136 59.5 170 57.5" stroke="#5fa8cf" stroke-width="2.6" fill="none"/>
  <!-- narrow ridge road on the crest -->
  <path d="M 0 39 Q 44 33.5 86 34.5 Q 128 35.5 170 38" stroke="#786a56" stroke-width="4.5" fill="none"/>
  <path d="M 10 38.4 Q 50 33.8 96 34.6" stroke="#f1c40f" stroke-width="1" fill="none" stroke-dasharray="5,4"/>
  <path d="M 128 35.8 Q 150 36.5 168 37.6" stroke="#f1c40f" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <!-- ridge-edge posts -->
  <rect x="60" y="31.5" width="2" height="4" fill="#ecf0f1"/>
  <rect x="112" y="32.5" width="2" height="4" fill="#ecf0f1"/>
  <!-- valley trees -->
  <circle cx="36" cy="52" r="3.2" fill="#2e6b45"/>
  <circle cx="150" cy="52" r="3.2" fill="#2e6b45"/>
</svg>
