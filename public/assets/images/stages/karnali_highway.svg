<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Karnali Highway - rugged remote rocky mountain road above a deep gorge -->

  <rect width="170" height="62" fill="#b8cfdd"/>
  <!-- jagged distant mountains -->
  <polygon points="6,32 30,14 54,32" fill="#9fb4c4"/>
  <polygon points="60,32 86,12 112,32" fill="#b0c4d4"/>
  <polygon points="118,32 144,15 168,32" fill="#9fb4c4"/>
  <!-- steep rocky cliff face (upper right) -->
  <polygon points="96,34 170,34 170,24 128,28 104,26" fill="#8d6e4f"/>
  <polygon points="104,26 128,28 126,31 106,29" fill="#6d4c35"/>
  <!-- rugged brown/green terrain -->
  <ellipse cx="40" cy="42" rx="66" ry="12" fill="#7a8b56"/>
  <ellipse cx="70" cy="48" rx="60" ry="10" fill="#6b7d4a"/>
  <!-- deep gorge below -->
  <polygon points="0,52 70,54 40,62 0,62" fill="#3e4a3a"/>
  <polygon points="60,55 170,50 170,62 80,62" fill="#4a5642"/>
  <!-- narrow ledge road cut into the hillside -->
  <path d="M 0 49 Q 48 45 88 41.5 Q 120 39 170 38 L 170 42.5 Q 122 43 92 45.5 Q 52 49 0 53.5 Z" fill="#6f5f4b"/>
  <path d="M 6 49.8 Q 52 46.5 96 43.2" stroke="#d9c9a3" stroke-width="1.1" fill="none" stroke-dasharray="4,4"/>
  <!-- fallen-rock boulders beside the road -->
  <ellipse cx="52" cy="46.5" rx="3" ry="2.2" fill="#5c4a38"/>
  <ellipse cx="132" cy="41.5" rx="2.6" ry="2" fill="#5c4a38"/>
  <ellipse cx="20" cy="51" rx="3.4" ry="2.4" fill="#54432f"/>
  <!-- sparse hardy shrubs -->
  <circle cx="86" cy="38" r="2.6" fill="#55703f"/>
  <circle cx="152" cy="35.5" r="2.4" fill="#55703f"/>
</svg>
