<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Birtamod Highway - humid eastern Terai with lush fields and scattered trees -->

  <rect width="170" height="62" fill="#c5ecf8"/>
  <!-- humid haze bands over the horizon -->
  <ellipse cx="50" cy="32" rx="84" ry="5.5" fill="#b0d8e8"/>
  <ellipse cx="140" cy="34" rx="62" ry="6" fill="#a0ccd8"/>
  <!-- lush agricultural field strips -->
  <rect x="0" y="36" width="170" height="11" fill="#5fae52"/>
  <rect x="0" y="37.5" width="170" height="2" fill="#74c464"/>
  <rect x="0" y="41.5" width="170" height="2" fill="#4e9c44"/>
  <rect x="0" y="44.5" width="170" height="2.5" fill="#6bba5a"/>
  <!-- scattered lush trees -->
  <circle cx="26" cy="35.5" r="4" fill="#2e7d3a"/>
  <rect x="24.5" y="38" width="3" height="5" fill="#4e342e"/>
  <circle cx="82" cy="35" r="3.4" fill="#388e3c"/>
  <rect x="80.5" y="37.5" width="3" height="4.5" fill="#4e342e"/>
  <circle cx="134" cy="35.5" r="4" fill="#2e7d3a"/>
  <rect x="132.5" y="38" width="3" height="5" fill="#4e342e"/>
  <circle cx="160" cy="36.5" r="3" fill="#388e3c"/>
  <!-- wide green highway -->
  <rect x="0" y="47" width="170" height="10" fill="#5c6a62"/>
  <rect x="0" y="47" width="170" height="1.6" fill="#8fa098"/>
  <rect x="10" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="54" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="98" y="51.5" width="14" height="2" fill="#f1c40f"/>
  <rect x="142" y="51.5" width="14" height="2" fill="#f1c40f"/>
</svg>
