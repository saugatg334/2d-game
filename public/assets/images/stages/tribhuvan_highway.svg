<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Tribhuvan Highway - historic winding hill road with switchbacks -->

  <rect width="170" height="62" fill="#8ecae6"/>
  <!-- distant Himalayan layers -->
  <polygon points="20,34 42,12 64,34" fill="#e0e7ef"/>
  <polygon points="52,34 74,10 96,34" fill="#eef4f8"/>
  <polygon points="112,34 134,13 156,34" fill="#e0e7ef"/>
  <!-- steep green slopes -->
  <ellipse cx="30" cy="42" rx="58" ry="12" fill="#2d6a4f"/>
  <ellipse cx="142" cy="46" rx="62" ry="14" fill="#40916c"/>
  <!-- dramatic roadside slope (left cliff) -->
  <polygon points="0,34 34,34 18,50 0,52" fill="#1b4332"/>
  <!-- narrow switchback road climbing -->
  <path d="M 170 60 L 120 55 L 74 50 L 92 44 L 62 41 L 84 37 L 60 34.5" stroke="#7a6a55" stroke-width="5" fill="none"/>
  <path d="M 168 59.5 L 120 54.5 L 76 49.5" stroke="#f1c40f" stroke-width="1.1" fill="none" stroke-dasharray="4,4"/>
  <path d="M 90 44 L 64 41" stroke="#f1c40f" stroke-width="1.1" fill="none" stroke-dasharray="4,4"/>
  <!-- edge posts on the drop side -->
  <rect x="112" y="50" width="2" height="5" fill="#ecf0f1"/>
  <rect x="70" y="44.5" width="2" height="5" fill="#ecf0f1"/>
  <rect x="88" y="38.5" width="2" height="5" fill="#ecf0f1"/>
  <!-- hardy hill trees -->
  <circle cx="148" cy="40" r="4" fill="#1b4332"/>
  <circle cx="160" cy="44" r="3.5" fill="#2d6a4f"/>
</svg>
