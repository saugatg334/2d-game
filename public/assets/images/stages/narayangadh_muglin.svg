<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Narayangadh-Muglin - constrained river-valley highway following the water -->

  <rect width="170" height="62" fill="#a9d8ef"/>
  <!-- layered background hills -->
  <ellipse cx="52" cy="28" rx="86" ry="9" fill="#8ab4cc"/>
  <ellipse cx="142" cy="31" rx="62" ry="10" fill="#7aa4be"/>
  <!-- steep green valley walls on both sides -->
  <path d="M 0 30 Q 30 32 52 40 L 60 62 L 0 62 Z" fill="#2f7a50"/>
  <path d="M 170 28 Q 140 32 118 42 L 112 62 L 170 62 Z" fill="#28704a"/>
  <!-- river running diagonally down the valley -->
  <path d="M 62 62 Q 74 52 92 48 Q 112 44 126 40 Q 142 36 170 34" stroke="#4f9fd8" stroke-width="6" fill="none"/>
  <path d="M 70 60 Q 88 50 112 44.5" stroke="#8ec8ec" fill="none" stroke-width="1.3"/>
  <!-- road following the river on the valley bench -->
  <path d="M 0 58 Q 34 56 56 51.5 Q 82 46 108 43.5 Q 136 41 170 40" stroke="#6f6350" stroke-width="5" fill="none"/>
  <path d="M 10 57.2 Q 40 55 62 50.8" stroke="#f1c40f" stroke-width="1.1" fill="none" stroke-dasharray="4,4"/>
  <path d="M 112 43 Q 140 41 168 40.2" stroke="#f1c40f" stroke-width="1.1" fill="none" stroke-dasharray="4,4"/>
  <!-- short bridge where the road crosses a side ravine -->
  <rect x="88" y="45.5" width="12" height="2" fill="#7d5a44"/>
  <rect x="90" y="47.5" width="2" height="6" fill="#5d4037"/>
  <rect x="96" y="47.5" width="2" height="6" fill="#5d4037"/>
  <!-- cliff-side trees -->
  <circle cx="22" cy="42" r="3" fill="#1e6b45"/>
  <circle cx="148" cy="35" r="3" fill="#1e6b45"/>
</svg>
