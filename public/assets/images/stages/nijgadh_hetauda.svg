<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Nijgadh-Hetauda - Terai-to-hill transition corridor -->

  <rect width="170" height="62" fill="#a9cce3"/>
  <!-- distant hazy hills -->
  <ellipse cx="42" cy="30" rx="62" ry="10" fill="#7fb3d5"/>
  <ellipse cx="132" cy="33" rx="56" ry="11" fill="#5499c7"/>
  <!-- green vegetation band -->
  <rect x="0" y="38" width="170" height="9" fill="#6b8e23"/>
  <!-- trees and bushes -->
  <circle cx="18" cy="38" r="4" fill="#229954"/>
  <rect x="16.5" y="40" width="3" height="4" fill="#5d4037"/>
  <circle cx="88" cy="37.5" r="4.5" fill="#27ae60"/>
  <circle cx="122" cy="38.5" r="3.5" fill="#2e8b57"/>
  <circle cx="156" cy="38" r="4" fill="#229954"/>
  <rect x="154.5" y="40" width="3" height="4" fill="#5d4037"/>
  <!-- broad corridor road -->
  <rect x="0" y="47" width="170" height="15" fill="#616e7c"/>
  <rect x="0" y="47" width="170" height="1.8" fill="#95a5a6"/>
  <!-- lane dashes -->
  <rect x="8" y="54" width="13" height="2" fill="#f1c40f"/>
  <rect x="52" y="54" width="13" height="2" fill="#f1c40f"/>
  <rect x="96" y="54" width="13" height="2" fill="#f1c40f"/>
  <rect x="140" y="54" width="13" height="2" fill="#f1c40f"/>
  <!-- roadside marker post -->
  <rect x="30" y="43" width="2" height="5" fill="#ecf0f1"/>
  <rect x="140" y="43" width="2" height="5" fill="#ecf0f1"/>
</svg>
