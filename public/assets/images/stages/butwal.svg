<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Butwal Gateway - urban road opening toward rising green hills -->

  <rect width="170" height="62" fill="#aedcf0"/>
  <!-- green hills rising in the background (gateway to the hills) -->
  <ellipse cx="52" cy="30" rx="70" ry="11" fill="#5c9464"/>
  <ellipse cx="140" cy="32" rx="62" ry="12" fill="#4c8556"/>
  <ellipse cx="96" cy="26" rx="44" ry="8" fill="#6ba674"/>
  <!-- low-rise gateway buildings lining the road -->
  <rect x="6" y="26" width="15" height="12" fill="#c9b8a0"/>
  <rect x="9" y="29" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="14" y="29" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="26" y="28" width="13" height="10" fill="#b8a488"/>
  <rect x="128" y="27" width="13" height="11" fill="#b8a488"/>
  <rect x="146" y="25" width="15" height="13" fill="#c9b8a0"/>
  <rect x="149" y="28" width="3" height="3.5" fill="#7a6a55"/>
  <rect x="155" y="28" width="3" height="3.5" fill="#7a6a55"/>
  <!-- utility poles -->
  <rect x="46" y="22" width="2" height="17" fill="#5d4436"/>
  <rect x="42.5" y="24" width="9" height="1.6" fill="#5d4436"/>
  <rect x="118" y="23" width="2" height="16" fill="#5d4436"/>
  <rect x="114.5" y="25" width="9" height="1.6" fill="#5d4436"/>
  <!-- roadside vegetation -->
  <circle cx="80" cy="35" r="3.4" fill="#3d7d4a"/>
  <rect x="78.5" y="37.5" width="3" height="4" fill="#6d5140"/>
  <circle cx="104" cy="36" r="3" fill="#3d7d4a"/>
  <!-- bus silhouette arriving at the gateway -->
  <rect x="66" y="38" width="16" height="6.5" fill="#3a7ec2"/>
  <rect x="68.5" y="40" width="3.5" height="2.5" fill="#cfe4f4"/>
  <rect x="74" y="40" width="3.5" height="2.5" fill="#cfe4f4"/>
  <circle cx="70" cy="45" r="1.5" fill="#333333"/>
  <circle cx="78" cy="45" r="1.5" fill="#333333"/>
  <!-- broad road sweeping toward the hills -->
  <path d="M 0 60 Q 44 56 84 53.5 Q 124 51 170 49.5 L 170 56 Q 126 57.5 88 59.5 Q 46 62 0 62 Z" fill="#5c666e"/>
  <path d="M 10 59.4 Q 52 56.6 92 54.4" stroke="#f1c40f" stroke-width="1.2" fill="none" stroke-dasharray="5,4"/>
  <path d="M 128 53 Q 150 52.2 168 51.4" stroke="#f1c40f" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
</svg>
