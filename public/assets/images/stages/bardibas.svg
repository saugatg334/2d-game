<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Bardibas Plains - broad open highway across dry warm Terai plains -->

  <rect width="170" height="62" fill="#f7e3b0"/>
  <!-- low distant hills on the northern horizon -->
  <ellipse cx="50" cy="34" rx="80" ry="6" fill="#d8b77e"/>
  <ellipse cx="140" cy="35.5" rx="60" ry="6.5" fill="#c9a868"/>
  <!-- dry warm plains -->
  <rect x="0" y="38" width="170" height="9" fill="#d8c088"/>
  <rect x="0" y="40" width="170" height="2" fill="#e0cc96"/>
  <!-- roadside trees along the highway -->
  <circle cx="20" cy="38" r="3.6" fill="#6b8f3a"/>
  <rect x="18.5" y="40" width="3" height="4.5" fill="#6d5140"/>
  <circle cx="58" cy="38" r="3.2" fill="#7a9c44"/>
  <rect x="56.5" y="40" width="3" height="4.5" fill="#6d5140"/>
  <circle cx="112" cy="37.5" r="3.6" fill="#6b8f3a"/>
  <rect x="110.5" y="40" width="3" height="4.5" fill="#6d5140"/>
  <circle cx="154" cy="38" r="3.2" fill="#7a9c44"/>
  <rect x="152.5" y="40" width="3" height="4.5" fill="#6d5140"/>
  <!-- dusty roadside shoulders -->
  <rect x="0" y="44" width="170" height="2" fill="#c9a86a"/>
  <!-- broad straight highway -->
  <rect x="0" y="46" width="170" height="11" fill="#5f6a70"/>
  <rect x="0" y="46" width="170" height="1.6" fill="#95a5a6"/>
  <rect x="12" y="51" width="14" height="2" fill="#f1c40f"/>
  <rect x="56" y="51" width="14" height="2" fill="#f1c40f"/>
  <rect x="100" y="51" width="14" height="2" fill="#f1c40f"/>
  <rect x="144" y="51" width="14" height="2" fill="#f1c40f"/>
</svg>
