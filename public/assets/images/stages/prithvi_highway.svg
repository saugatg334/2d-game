<svg xmlns="http://www.w3.org/2000/svg" width="170" height="62" viewBox="0 0 170 62">
  <!-- Prithvi Highway - major intercity highway along a river valley -->

  <rect width="170" height="62" fill="#a3d5ff"/>
  <!-- layered mountains -->
  <polygon points="0,32 26,10 52,32" fill="#8ea8c3"/>
  <polygon points="40,32 66,8 92,32" fill="#a8c0d8"/>
  <polygon points="104,32 130,11 156,32" fill="#8ea8c3"/>
  <!-- green valley sides -->
  <ellipse cx="34" cy="40" rx="60" ry="10" fill="#4f9d69"/>
  <ellipse cx="140" cy="43" rx="64" ry="12" fill="#3d8b5f"/>
  <!-- Trishuli river hint along the valley floor -->
  <path d="M 0 51 Q 40 47 70 50 Q 100 53 130 49 L 170 51 L 170 62 L 0 62 Z" fill="#5b9bd5"/>
  <path d="M 10 53 Q 60 50 110 53" stroke="#8fc1e9" fill="none" stroke-width="1.6"/>
  <!-- bridge crossing the river -->
  <rect x="128" y="42" width="34" height="2.5" fill="#8d6e63"/>
  <rect x="130" y="44.5" width="2.5" height="8" fill="#6d4c41"/>
  <rect x="146" y="44.5" width="2.5" height="8" fill="#6d4c41"/>
  <rect x="158" y="44.5" width="2.5" height="8" fill="#6d4c41"/>
  <!-- broad highway between road and river -->
  <path d="M 0 44 Q 50 40 96 41 Q 136 42 170 40 L 170 47 L 0 49 Z" fill="#607078"/>
  <path d="M 6 45.5 Q 60 42 120 43.5" stroke="#f1c40f" stroke-width="1.3" fill="none" stroke-dasharray="6,5"/>
  <!-- roadside vegetation -->
  <circle cx="14" cy="38" r="4" fill="#2e7d32"/>
  <circle cx="64" cy="35.5" r="3.5" fill="#388e3c"/>
  <circle cx="108" cy="35" r="4" fill="#2e7d32"/>
</svg>
