<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Ashish - racer with styled hair and racing jacket -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#e8b88a"/>
  <!-- Short styled hair with swept quiff -->
  <path d="M31 32 Q31 19 50 19 Q68 19 69 31 Q64 25 56 24 L62 18 Q48 16 38 24 Q33 27 31 32 Z" fill="#1a1a1a"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#e8b88a"/>
  <circle cx="69" cy="36" r="3" fill="#e8b88a"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smirk -->
  <path d="M44 43 Q51 48 58 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: crimson racing jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#c0392b"/>
  <!-- Diagonal white speed stripe -->
  <path d="M35 68 L65 58 L65 65 L35 75 Z" fill="#ecf0f1"/>
  <!-- Second thin stripe -->
  <path d="M35 78 L65 68 L65 71 L35 81 Z" fill="#f1c40f"/>
  <!-- Jacket collar -->
  <path d="M43 55 L50 60 L57 55 L57 58 L50 63 L43 58 Z" fill="#922b21"/>
  <!-- Racing glove at waist -->
  <ellipse cx="39" cy="77" rx="4.5" ry="3.5" fill="#7f8c8d"/>
  <line x1="37" y1="76" x2="41" y2="79" stroke="#5d6d7e" stroke-width="1"/>
</svg>
