<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Sarita - female courier with cross-body delivery bag -->

  <!-- Hair with side ponytail (behind head) -->
  <path d="M31 32 Q30 50 35 56 L43 56 L41 32 Z" fill="#241a12"/>
  <circle cx="72" cy="30" r="5.5" fill="#241a12"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e8b088"/>
  <!-- Hair top -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 26 50 27 Q40 26 32 32 Z" fill="#241a12"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#e8b088"/>
  <circle cx="68" cy="36" r="2.5" fill="#e8b088"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: orange courier jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#e67e22"/>
  <!-- Jacket zip -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#a04000" stroke-width="1.5"/>
  <circle cx="50" cy="61" r="1.2" fill="#f5e9d3"/>
  <!-- Cross-body delivery strap -->
  <path d="M38 57 L62 88 L55 90 L33 64 Z" fill="#2c3e50"/>
  <!-- Parcel in strap pouch at hip -->
  <rect x="54" y="76" width="13" height="11" rx="1.5" fill="#b9855c" stroke="#8d6e4a" stroke-width="1"/>
  <line x1="60.5" y1="76" x2="60.5" y2="87" stroke="#8d6e4a" stroke-width="1.2"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#a04000" stroke-width="1.5"/>
</svg>
