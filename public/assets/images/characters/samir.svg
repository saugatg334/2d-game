<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Samir - rider with flat cap and open jacket -->

  <!-- Head -->
  <circle cx="50" cy="36" r="18" fill="#e8b88a"/>
  <!-- Flat cap: crown + stiff brim -->
  <path d="M34 30 A16 13 0 0 1 66 30 Z" fill="#57534e"/>
  <ellipse cx="50" cy="30" rx="19" ry="3.5" fill="#44403c"/>
  <path d="M64 30 L80 31 Q82 31.5 81 33.5 L64 33 Z" fill="#44403c"/>
  <!-- Cap button -->
  <circle cx="50" cy="20" r="2" fill="#292524"/>
  <!-- Dark hair visible at edges -->
  <path d="M33 34 Q32 28 35 26 L35 34 Z" fill="#262626"/>
  <path d="M67 34 Q68 28 65 26 L65 34 Z" fill="#262626"/>
  <!-- Ears -->
  <circle cx="32" cy="37" r="2.5" fill="#e8b88a"/>
  <circle cx="68" cy="37" r="2.5" fill="#e8b88a"/>
  <!-- Eyes -->
  <circle cx="43" cy="35" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="35" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M44 44 Q50 49 56 44" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: brown open jacket over shirt -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#92400e"/>
  <!-- Shirt panel visible in middle -->
  <rect x="45" y="55" width="10" height="35" fill="#f5f5f4"/>
  <!-- Jacket open edges -->
  <line x1="45" y1="55" x2="45" y2="90" stroke="#78350f" stroke-width="1.5"/>
  <line x1="55" y1="55" x2="55" y2="90" stroke="#78350f" stroke-width="1.5"/>
  <!-- Shirt buttons -->
  <circle cx="50" cy="63" r="1" fill="#57534e"/>
  <circle cx="50" cy="70" r="1" fill="#57534e"/>
  <circle cx="50" cy="77" r="1" fill="#57534e"/>
</svg>
