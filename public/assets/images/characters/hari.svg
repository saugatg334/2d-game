<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Hari - rider with earthy jacket and neck scarf -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#d4a574"/>
  <!-- Short dark hair -->
  <path d="M31 32 Q31 19 50 19 Q69 19 69 32 Q60 25 50 26 Q40 25 31 32 Z" fill="#1c1917"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#d4a574"/>
  <circle cx="69" cy="36" r="3" fill="#d4a574"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: warm terracotta jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#b45309"/>
  <!-- Jacket zip -->
  <line x1="50" y1="59" x2="50" y2="88" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- Small red loop scarf -->
  <path d="M43 55 L57 55 L55 61 L45 61 Z" fill="#dc2626"/>
  <path d="M46 60 L48 66 L50 60 Z" fill="#991b1b"/>
  <!-- Corduroy texture lines -->
  <line x1="39" y1="64" x2="39" y2="88" stroke="#92400e" stroke-width="1"/>
  <line x1="61" y1="64" x2="61" y2="88" stroke="#92400e" stroke-width="1"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#7c2d12" stroke-width="1.5"/>
</svg>
