<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Manju - woman with head wrap and sari drape -->

  <!-- Hair with bun (behind head) -->
  <path d="M31 32 Q30 50 36 58 L44 58 L42 32 Z" fill="#2e2118"/>
  <path d="M69 32 Q70 50 64 58 L56 58 L58 32 Z" fill="#2e2118"/>
  <circle cx="72" cy="26" r="6" fill="#2e2118"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e0a878"/>
  <!-- Orange head wrap: crown + fold lines -->
  <path d="M31 31 Q33 17 50 17 Q67 17 69 31 L69 33 L31 33 Z" fill="#e67e22"/>
  <path d="M38 19 Q40 26 39 32" stroke="#ca6f1e" stroke-width="1.5" fill="none"/>
  <path d="M50 17 Q50 25 50 32" stroke="#ca6f1e" stroke-width="1.5" fill="none"/>
  <path d="M62 19 Q60 26 61 32" stroke="#ca6f1e" stroke-width="1.5" fill="none"/>
  <!-- Ears -->
  <circle cx="31" cy="37" r="2.5" fill="#e0a878"/>
  <circle cx="69" cy="37" r="2.5" fill="#e0a878"/>
  <!-- Eyes -->
  <circle cx="43" cy="34" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="34" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M44 43 Q50 48 56 43" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Nose stud -->
  <circle cx="53" cy="39" r="1" fill="#f1c40f"/>
  <!-- Body: teal blouse with orange sari drape -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#148f77"/>
  <!-- Sari drape over shoulder -->
  <path d="M53 55 L65 55 L65 90 L55 90 L47 68 Z" fill="#e67e22" opacity="0.92"/>
  <line x1="57" y1="58" x2="60" y2="88" stroke="#ca6f1e" stroke-width="1.2"/>
  <!-- Necklace dots -->
  <circle cx="45" cy="58" r="1.2" fill="#f1c40f"/>
  <circle cx="49" cy="59.5" r="1.2" fill="#f1c40f"/>
  <circle cx="53" cy="59" r="1.2" fill="#f1c40f"/>
</svg>
