<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Dipesh - rider in checked overshirt -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#e8b88a"/>
  <!-- Short side-parted dark hair -->
  <path d="M31 32 Q31 19 50 19 Q69 19 69 32 Q63 24 48 26 Q36 27 31 34 Z" fill="#1f1f1f"/>
  <!-- Part line -->
  <line x1="52" y1="21" x2="54" y2="27" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#e8b88a"/>
  <circle cx="69" cy="36" r="3" fill="#e8b88a"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Relaxed smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: amber checked overshirt -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#d97706"/>
  <!-- Check pattern: verticals -->
  <line x1="42" y1="55" x2="42" y2="90" stroke="#92400e" stroke-width="1.5"/>
  <line x1="50" y1="55" x2="50" y2="90" stroke="#92400e" stroke-width="1.5"/>
  <line x1="58" y1="55" x2="58" y2="90" stroke="#92400e" stroke-width="1.5"/>
  <!-- Check pattern: horizontals -->
  <line x1="35" y1="64" x2="65" y2="64" stroke="#92400e" stroke-width="1.5"/>
  <line x1="35" y1="74" x2="65" y2="74" stroke="#92400e" stroke-width="1.5"/>
  <line x1="35" y1="84" x2="65" y2="84" stroke="#92400e" stroke-width="1.5"/>
  <!-- Open shirt edges showing tee -->
  <rect x="46" y="55" width="8" height="35" fill="#f5f5f4"/>
  <line x1="46" y1="55" x2="46" y2="90" stroke="#92400e" stroke-width="1.5"/>
  <line x1="54" y1="55" x2="54" y2="90" stroke="#92400e" stroke-width="1.5"/>
  <!-- Waist band accessory -->
  <rect x="35" y="79" width="30" height="4" fill="#7c2d12"/>
</svg>
