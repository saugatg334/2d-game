<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Legendary golden aura -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#aura)"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f5cba7"/>
  <!-- Legendary helmet -->
  <ellipse cx="50" cy="22" rx="20" ry="14" fill="#f1c40f"/>
  <rect x="32" y="18" width="36" height="6" rx="2" fill="#f39c12"/>
  <!-- Helmet emblem -->
  <circle cx="50" cy="22" r="5" fill="#e74c3c"/>
  <!-- Eyes -->
  <circle cx="43" cy="32" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="32" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M43 42 Q50 48 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body - special outfit -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#8e44ad"/>
  <!-- Outfit details -->
  <rect x="40" y="58" width="20" height="8" rx="2" fill="#f1c40f"/>
  <rect x="42" y="68" width="16" height="4" rx="1" fill="#f39c12"/>
  <!-- Star emblem -->
  <polygon points="50,75 52,80 57,80 53,84 55,89 50,86 45,89 47,84 43,80 48,80" fill="#f1c40f"/>
</svg>
