<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Bimal - racer with full helmet and racing suit -->

  <!-- Lower face (visible below visor) -->
  <circle cx="50" cy="35" r="18" fill="#d4a574"/>
  <!-- Full racing helmet: dome -->
  <path d="M31 34 A19 19 0 0 1 69 34 L69 36 L31 36 Z" fill="#e74c3c"/>
  <!-- Helmet chin bar sides -->
  <rect x="29" y="34" width="5" height="10" rx="2" fill="#c0392b"/>
  <rect x="66" y="34" width="5" height="10" rx="2" fill="#c0392b"/>
  <!-- Dark visor band -->
  <path d="M32 33 L68 33 L68 41 Q60 44 50 44 Q40 44 32 41 Z" fill="#2c3e50"/>
  <!-- Visor reflection stripe -->
  <path d="M35 35 L48 35 L44 40 L33 39 Z" fill="#5d6d7e" opacity="0.8"/>
  <!-- Helmet top stripe -->
  <rect x="47" y="14" width="6" height="19" fill="#ecf0f1"/>
  <!-- Confident smile below visor -->
  <path d="M45 49 Q50 53 55 49" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: navy racing suit -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#2c3e50"/>
  <!-- Chest number roundel (blank) -->
  <circle cx="50" cy="66" r="7" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <circle cx="50" cy="66" r="4" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Suit side stripes -->
  <rect x="35" y="78" width="30" height="3" fill="#e74c3c"/>
  <!-- Suit shoulder pads -->
  <rect x="33" y="56" width="6" height="9" rx="2" fill="#1a252f"/>
  <rect x="61" y="56" width="6" height="9" rx="2" fill="#1a252f"/>
  <!-- Suit collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#1a252f" stroke-width="1.5"/>
</svg>
