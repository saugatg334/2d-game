<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mamata - female rider with low ponytail -->

  <!-- Low ponytail hanging behind left shoulder -->
  <path d="M32 40 Q26 50 30 62 Q33 70 40 72 Q35 64 36 54 Q37 45 38 42 Z" fill="#241a12"/>
  <!-- Hair tie -->
  <circle cx="34" cy="52" r="2" fill="#ec4899"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f0c8a0"/>
  <!-- Hair top, swept back to low tie -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 25 50 26 Q40 25 32 32 Z" fill="#241a12"/>
  <!-- Ear (right visible) -->
  <circle cx="68" cy="36" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M44 42 Q50 48 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: rose riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#ec4899"/>
  <!-- Centre zip -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#9d174d" stroke-width="1.5"/>
  <!-- Bead necklace -->
  <path d="M44 56 Q50 62 56 56" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="50" cy="61" r="1.3" fill="#fbbf24"/>
  <!-- Chest pocket -->
  <rect x="39" y="68" width="8" height="7" rx="1" fill="#f9a8d4"/>
</svg>
