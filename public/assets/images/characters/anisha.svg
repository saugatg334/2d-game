<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Anisha - female rider with bob haircut and polka scarf -->

  <!-- Bob hair (chin-length panels) -->
  <path d="M31 30 Q29 48 34 53 L40 53 L39 30 Z" fill="#33221a"/>
  <path d="M69 30 Q71 48 66 53 L60 53 L61 30 Z" fill="#33221a"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f0c8a0"/>
  <!-- Bob top with fringe -->
  <path d="M31 32 Q31 19 50 19 Q69 19 69 32 L69 34 Q60 26 50 26 Q40 26 31 34 Z" fill="#33221a"/>
  <rect x="34" y="25" width="32" height="4" rx="2" fill="#33221a"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="2.5" fill="#f0c8a0"/>
  <circle cx="69" cy="36" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Cheerful open smile -->
  <path d="M43 42 Q50 49 57 42 Z" fill="#7a4a32"/>
  <!-- Body: cherry sporty riding top -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#e11d48"/>
  <!-- White chevron stripe -->
  <path d="M35 70 L50 63 L65 70 L65 75 L50 68 L35 75 Z" fill="#fecdd3"/>
  <!-- Polka-dot neck scarf -->
  <path d="M43 55 L57 55 L55 62 L45 62 Z" fill="#0ea5e9"/>
  <circle cx="47" cy="58" r="1" fill="#e0f2fe"/>
  <circle cx="52" cy="59.5" r="1" fill="#e0f2fe"/>
</svg>
