<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Milan - younger slim farmer, green tee and fringe hair -->

  <!-- Head (slightly smaller, younger) -->
  <circle cx="50" cy="37" r="17" fill="#f0c8a0"/>
  <!-- Fringe haircut: top + straight fringe -->
  <path d="M33 36 Q33 24 50 24 Q67 24 67 36 L67 31 Q60 28 50 28 Q40 28 33 31 Z" fill="#171717"/>
  <rect x="33" y="28" width="34" height="4" rx="2" fill="#171717"/>
  <!-- Ears -->
  <circle cx="33" cy="38" r="2.5" fill="#f0c8a0"/>
  <circle cx="67" cy="38" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="35" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="35" r="3" fill="#2c3e50"/>
  <!-- Small smile -->
  <path d="M45 44 Q50 48 55 44" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: bright green tee -->
  <rect x="36" y="56" width="28" height="34" rx="5" fill="#27ae60"/>
  <!-- Field-mud splash on hem -->
  <ellipse cx="44" cy="87" rx="5" ry="2" fill="#8d6e4a" opacity="0.6"/>
  <ellipse cx="56" cy="88" rx="4" ry="1.8" fill="#8d6e4a" opacity="0.5"/>
  <!-- Collar trim -->
  <path d="M44 56 Q50 60 56 56" fill="none" stroke="#1e8449" stroke-width="2"/>
  <!-- Tiny sickle hook at waist (geometric) -->
  <path d="M62 76 Q68 78 66 84" fill="none" stroke="#95a5a6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
