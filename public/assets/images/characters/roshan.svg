<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Roshan - mechanic, denim shirt with tool belt -->

  <!-- Head -->
  <circle cx="50" cy="35" r="20" fill="#c68955"/>
  <!-- Wavy dark-brown hair (wider) -->
  <ellipse cx="50" cy="23" rx="20" ry="11" fill="#3a2a1a"/>
  <!-- Ears -->
  <circle cx="30" cy="36" r="3" fill="#c68955"/>
  <circle cx="70" cy="36" r="3" fill="#c68955"/>
  <!-- Eyes -->
  <circle cx="43" cy="32" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="32" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M43 42 Q50 48 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: denim work shirt -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#34495e"/>
  <!-- Shirt placket -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Tool belt across waist -->
  <rect x="34" y="74" width="32" height="6" rx="1.5" fill="#8d6e4a"/>
  <!-- Belt pouches -->
  <rect x="37" y="79" width="7" height="8" rx="1" fill="#7a5c3a"/>
  <rect x="56" y="79" width="7" height="8" rx="1" fill="#7a5c3a"/>
  <!-- Belt buckle -->
  <rect x="47" y="75" width="6" height="4" rx="1" fill="#bdc3c7"/>
  <!-- Work glove tucked in belt -->
  <ellipse cx="43" cy="72" rx="4" ry="3" fill="#d9c7a8"/>
</svg>
