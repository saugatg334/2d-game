<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Asmita - female rider with neat side ponytail and indigo jacket -->

  <!-- Neat side ponytail draped over right shoulder -->
  <path d="M64 28 Q74 30 76 42 Q77 52 72 58 Q73 48 70 40 Q68 32 62 30 Z" fill="#1f1f1f"/>
  <path d="M70 36 L74 37 M71 44 L75 45 M70 52 L74 53" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Ponytail tie -->
  <circle cx="68" cy="30" r="2.5" fill="#facc15"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e8b088"/>
  <!-- Hair top swept to ponytail side -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 25 50 26 Q40 25 32 32 Z" fill="#1f1f1f"/>
  <!-- Ears + gold earring -->
  <circle cx="32" cy="36" r="2.5" fill="#e8b088"/>
  <circle cx="68" cy="36" r="2.5" fill="#e8b088"/>
  <circle cx="68" cy="41" r="1.5" fill="#fbbf24"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: deep indigo riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#3730a3"/>
  <!-- Zip + collar -->
  <line x1="50" y1="60" x2="50" y2="88" stroke="#1e1b4b" stroke-width="1.5"/>
  <rect x="44" y="53" width="12" height="4" rx="1.5" fill="#1e1b4b"/>
  <!-- Small red scarf accent -->
  <path d="M44 58 L56 58 L54 63 L46 63 Z" fill="#dc2626"/>
  <path d="M47 62 L49 68 L51 62 Z" fill="#991b1b"/>
</svg>
