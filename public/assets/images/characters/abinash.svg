<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Abinash - mechanic, yellow hard hat and overalls -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#d4a574"/>
  <!-- Hard hat: dome + brim -->
  <path d="M33 27 A17 15 0 0 1 67 27 Z" fill="#f1c40f"/>
  <ellipse cx="50" cy="27" rx="22" ry="4.5" fill="#d4ac0d"/>
  <!-- Hat ridge -->
  <rect x="47" y="13" width="6" height="14" rx="2" fill="#d4ac0d"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#d4a574"/>
  <circle cx="69" cy="36" r="3" fill="#d4a574"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M43 42 Q50 48 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: grey-blue overalls -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#5d6d7e"/>
  <!-- Overall straps -->
  <rect x="39" y="55" width="5" height="14" fill="#46576a"/>
  <rect x="56" y="55" width="5" height="14" fill="#46576a"/>
  <!-- Strap buttons -->
  <circle cx="41.5" cy="68" r="1.8" fill="#bdc3c7"/>
  <circle cx="58.5" cy="68" r="1.8" fill="#bdc3c7"/>
  <!-- Bib pocket with safety stripe -->
  <rect x="45" y="70" width="10" height="8" rx="1" fill="#46576a"/>
  <rect x="46" y="72.5" width="8" height="2" rx="1" fill="#e67e22"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#46576a" stroke-width="1.5"/>
</svg>
