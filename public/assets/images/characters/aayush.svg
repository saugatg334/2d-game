<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Aayush - young rural worker, mustard shirt and red neck scarf -->

  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#eebe96"/>
  <!-- Short spiky hair (jagged top) -->
  <path d="M32 30 L36 21 L41 26 L46 18 L52 25 L57 19 L62 26 L68 22 L68 30 Z" fill="#1f1f1f"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="3" fill="#eebe96"/>
  <circle cx="68" cy="36" r="3" fill="#eebe96"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M43 42 Q50 48 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: mustard work shirt -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#d4a017"/>
  <!-- Red neck scarf -->
  <path d="M42 55 L58 55 L54 64 L46 64 Z" fill="#c0392b"/>
  <path d="M46 63 L49 72 L52 63 Z" fill="#a93226"/>
  <!-- Chest pocket -->
  <rect x="56" y="64" width="8" height="7" rx="1" fill="#b3890f"/>
  <!-- Work glove tucked at waist -->
  <ellipse cx="40" cy="74" rx="4" ry="3" fill="#d9c7a8"/>
</svg>
