<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Sandesh - younger mechanic, red cap and teal shirt -->

  <!-- Head (slightly smaller, younger) -->
  <circle cx="50" cy="36" r="18" fill="#f0c8a0"/>
  <!-- Baseball cap: crown + brim -->
  <path d="M32 32 A18 15 0 0 1 68 32 Z" fill="#e74c3c"/>
  <rect x="30" y="30" width="40" height="5" rx="2" fill="#c0392b"/>
  <path d="M66 32 L80 32 Q82 32 82 35 L82 36 L66 36 Z" fill="#2c3e50"/>
  <!-- Cap button -->
  <circle cx="50" cy="20" r="2" fill="#c0392b"/>
  <!-- Ears -->
  <circle cx="32" cy="37" r="3" fill="#f0c8a0"/>
  <circle cx="68" cy="37" r="3" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="34" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="34" r="3" fill="#2c3e50"/>
  <!-- Big youthful smile -->
  <path d="M42 42 Q50 50 58 42 Z" fill="#7a4a32"/>
  <!-- Body: teal workshop t-shirt -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#16a085"/>
  <!-- Double white racing stripes -->
  <rect x="44" y="57" width="3" height="33" fill="#ecf0f1" opacity="0.85"/>
  <rect x="50" y="57" width="3" height="33" fill="#ecf0f1" opacity="0.85"/>
  <!-- Collar trim -->
  <path d="M43 55 Q50 60 57 55" fill="none" stroke="#0e6655" stroke-width="2"/>
  <!-- Pencil behind ear -->
  <rect x="68" y="30" width="3" height="9" rx="1" fill="#f1c40f"/>
  <path d="M68 39 L69.5 42 L71 39 Z" fill="#2c3e50"/>
</svg>
