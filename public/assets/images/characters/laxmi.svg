<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Laxmi - female rider with wavy shoulder hair and loop scarf -->

  <!-- Wavy shoulder-length hair panels -->
  <path d="M31 30 Q28 46 33 54 Q30 56 32 60 Q38 56 40 52 L39 30 Z" fill="#2e2118"/>
  <path d="M69 30 Q72 46 67 54 Q70 56 68 60 Q62 56 60 52 L61 30 Z" fill="#2e2118"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f0c8a0"/>
  <!-- Hair top with side sweep -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q58 24 44 27 Q36 28 32 34 Z" fill="#2e2118"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#f0c8a0"/>
  <circle cx="68" cy="36" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Cheerful open smile -->
  <path d="M43 42 Q50 49 57 42 Z" fill="#7a4a32"/>
  <!-- Body: green casual riding outfit -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#059669"/>
  <!-- Placket -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#047857" stroke-width="1.5"/>
  <!-- Chunky loop scarf with pattern dots -->
  <path d="M42 54 Q50 62 58 54 Q60 58 56 62 Q50 66 44 62 Q40 58 42 54 Z" fill="#f59e0b"/>
  <circle cx="47" cy="60" r="1" fill="#fef3c7"/>
  <circle cx="53" cy="60" r="1" fill="#fef3c7"/>
</svg>
