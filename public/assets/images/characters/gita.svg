<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Gita - female rider with twin braids -->

  <!-- Twin braids hanging down both sides -->
  <path d="M31 30 Q24 38 27 50 Q29 60 34 64 Q31 54 33 44 Q34 36 36 32 Z" fill="#1f1f1f"/>
  <path d="M69 30 Q76 38 73 50 Q71 60 66 64 Q69 54 67 44 Q66 36 64 32 Z" fill="#1f1f1f"/>
  <!-- Braid ties -->
  <circle cx="30" cy="52" r="2" fill="#a855f7"/>
  <circle cx="70" cy="52" r="2" fill="#a855f7"/>
  <!-- Braid segment lines -->
  <line x1="28" y1="40" x2="32" y2="41" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="68" y1="40" x2="72" y2="41" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e8b088"/>
  <!-- Hair top with centre part -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 25 50 26 Q40 25 32 32 Z" fill="#1f1f1f"/>
  <path d="M50 20 L50 27" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#e8b088"/>
  <circle cx="68" cy="36" r="2.5" fill="#e8b088"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M44 42 Q50 48 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: violet riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#6d28d9"/>
  <!-- Zip + high collar -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#4c1d95" stroke-width="1.5"/>
  <rect x="44" y="53" width="12" height="4" rx="1.5" fill="#4c1d95"/>
  <!-- Small mirror charm accessory -->
  <circle cx="58" cy="70" r="2.5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
</svg>
