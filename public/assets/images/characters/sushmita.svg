<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Sushmita - female rider with long hair and gloves -->

  <!-- Long hair panels (behind head) -->
  <path d="M30 30 Q28 54 34 62 L42 62 L40 30 Z" fill="#1f1f1f"/>
  <path d="M70 30 Q72 54 66 62 L58 62 L60 30 Z" fill="#1f1f1f"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f0c8a0"/>
  <!-- Hair top -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 26 50 27 Q40 26 32 32 Z" fill="#1f1f1f"/>
  <!-- Hair pin -->
  <rect x="58" y="24" width="8" height="2.5" rx="1" fill="#e74c3c"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#f0c8a0"/>
  <circle cx="68" cy="36" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: plum riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#7c3aed"/>
  <!-- Shoulder panels -->
  <rect x="35" y="55" width="7" height="14" rx="2" fill="#5b21b6"/>
  <rect x="58" y="55" width="7" height="14" rx="2" fill="#5b21b6"/>
  <!-- Jacket zip -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#4c1d95" stroke-width="1.5"/>
  <!-- Riding gloves at waist -->
  <ellipse cx="39" cy="76" rx="4" ry="3" fill="#2c3e50"/>
  <ellipse cx="61" cy="76" rx="4" ry="3" fill="#2c3e50"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#4c1d95" stroke-width="1.5"/>
</svg>
