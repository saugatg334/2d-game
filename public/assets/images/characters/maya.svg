<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Maya - female rider with green headband and maroon jacket -->

  <!-- Shoulder-length dark hair panels -->
  <path d="M31 30 Q29 48 35 54 L41 54 L40 30 Z" fill="#2a1f16"/>
  <path d="M69 30 Q71 48 65 54 L59 54 L60 30 Z" fill="#2a1f16"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#f0c8a0"/>
  <!-- Hair top -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q60 26 50 27 Q40 26 32 32 Z" fill="#2a1f16"/>
  <!-- Teal headband across hair -->
  <path d="M31 30 Q50 22 69 30 L69 34 Q50 26 31 34 Z" fill="#0d9488"/>
  <!-- Headband knot at side -->
  <circle cx="66" cy="30" r="2" fill="#0f766e"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="2.5" fill="#f0c8a0"/>
  <circle cx="68" cy="36" r="2.5" fill="#f0c8a0"/>
  <!-- Eyes -->
  <circle cx="43" cy="34" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="34" r="3" fill="#2c3e50"/>
  <!-- Cheerful smile -->
  <path d="M43 43 Q50 49 57 43 Z" fill="#7a4a32"/>
  <!-- Body: cream inner shirt under maroon jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#fef3c7"/>
  <!-- Maroon open jacket panels -->
  <path d="M35 55 L44 55 L44 90 L35 90 Z" fill="#881337"/>
  <path d="M56 55 L65 55 L65 90 L56 90 Z" fill="#881337"/>
  <!-- Jacket edges -->
  <line x1="44" y1="55" x2="44" y2="90" stroke="#4c0519" stroke-width="1.2"/>
  <line x1="56" y1="55" x2="56" y2="90" stroke="#4c0519" stroke-width="1.2"/>
  <!-- Waist pouch on strap -->
  <rect x="38" y="77" width="12" height="9" rx="2" fill="#4c0519"/>
  <rect x="40" y="79" width="8" height="3" rx="1" fill="#fda4af"/>
  <!-- Shirt buttons -->
  <circle cx="50" cy="62" r="1" fill="#a8a29e"/>
  <circle cx="50" cy="69" r="1" fill="#a8a29e"/>
</svg>
