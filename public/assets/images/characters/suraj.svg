<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Suraj - rider with curly crop and belted jacket -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#d9a06b"/>
  <!-- Curly textured crop: bumpy dome -->
  <path d="M31 32 Q28 26 33 23 Q34 17 41 18 Q45 13 52 16 Q58 13 62 18 Q68 18 68 25 Q72 28 68 33 Q62 25 50 26 Q38 25 31 32 Z" fill="#1c1917"/>
  <!-- Curl accents -->
  <circle cx="37" cy="23" r="2" fill="#1c1917"/>
  <circle cx="45" cy="19" r="2" fill="#1c1917"/>
  <circle cx="56" cy="18" r="2" fill="#1c1917"/>
  <circle cx="64" cy="23" r="2" fill="#1c1917"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#d9a06b"/>
  <circle cx="69" cy="36" r="3" fill="#d9a06b"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M43 42 Q50 48 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: brown casual riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#78350f"/>
  <!-- Chest pockets -->
  <rect x="38" y="62" width="8" height="6" rx="1" fill="none" stroke="#451a03" stroke-width="1"/>
  <rect x="54" y="62" width="8" height="6" rx="1" fill="none" stroke="#451a03" stroke-width="1"/>
  <!-- Waist belt with buckle -->
  <rect x="35" y="76" width="30" height="5" fill="#451a03"/>
  <rect x="47" y="76.5" width="6" height="4" rx="1" fill="#d6d3d1"/>
  <!-- Single riding glove -->
  <ellipse cx="60" cy="85" rx="4" ry="3" fill="#292524"/>
</svg>
