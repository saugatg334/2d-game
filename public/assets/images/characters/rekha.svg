<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Rekha - female rider with upright high ponytail -->

  <!-- Upright ponytail rising from crown -->
  <path d="M50 20 Q46 8 54 4 Q62 2 62 10 Q62 16 56 20 Z" fill="#33221a"/>
  <path d="M56 8 L62 6 M54 13 L63 11" stroke="#4a3826" stroke-width="1"/>
  <!-- Ponytail band -->
  <rect x="47" y="16" width="9" height="4" rx="2" fill="#dc2626"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e0a878"/>
  <!-- Sleek pulled-back hair -->
  <path d="M32 33 Q32 20 50 20 Q68 20 68 33 Q58 26 50 27 Q42 26 32 33 Z" fill="#33221a"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#e0a878"/>
  <circle cx="68" cy="36" r="2.5" fill="#e0a878"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smirk -->
  <path d="M45 43 Q51 47 57 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: blue sporty zip jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#2563eb"/>
  <!-- White zip + pull tab -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#eff6ff" stroke-width="1.8"/>
  <rect x="48.5" y="62" width="3" height="5" rx="1" fill="#dc2626"/>
  <!-- Wristband detail -->
  <ellipse cx="38" cy="78" rx="4" ry="2.5" fill="#dc2626"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#1e40af" stroke-width="1.5"/>
</svg>
