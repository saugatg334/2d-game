<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Dipak - rugged mechanic, bandana and stubble -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#d9a06b"/>
  <!-- Stubble beard (lower face shade) -->
  <path d="M31 38 A19 19 0 0 0 69 38 L69 44 Q60 54 50 54 Q40 54 31 44 Z" fill="#5d4a30" opacity="0.55"/>
  <!-- Red bandana: crown + knot -->
  <path d="M31 30 A19 16 0 0 1 69 30 L69 34 L31 34 Z" fill="#c0392b"/>
  <path d="M31 30 L24 26 L27 33 Z" fill="#a93226"/>
  <path d="M69 30 L76 27 L73 34 Z" fill="#a93226"/>
  <!-- Bandana pattern dots -->
  <circle cx="42" cy="28" r="1.5" fill="#e74c3c"/>
  <circle cx="50" cy="26" r="1.5" fill="#e74c3c"/>
  <circle cx="58" cy="28" r="1.5" fill="#e74c3c"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M43 43 Q50 48 57 43" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: maroon shirt, rolled sleeves -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#7b241c"/>
  <!-- Rolled sleeve cuffs -->
  <rect x="31" y="60" width="6" height="7" rx="2" fill="#943126"/>
  <rect x="63" y="60" width="6" height="7" rx="2" fill="#943126"/>
  <!-- Oil smudge on chest -->
  <ellipse cx="56" cy="70" rx="5" ry="3.5" fill="#2c2c2c" opacity="0.6"/>
  <ellipse cx="53" cy="73" rx="2.5" ry="2" fill="#2c2c2c" opacity="0.5"/>
  <!-- Chest pocket -->
  <rect x="40" y="63" width="9" height="7" rx="1" fill="#641e16"/>
</svg>
