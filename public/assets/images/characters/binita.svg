<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Binita - female rider with side braid -->

  <!-- Side braid sweeping over shoulder -->
  <path d="M66 30 Q76 36 74 50 Q73 60 66 66 Q70 56 69 46 Q68 36 62 32 Z" fill="#241a12"/>
  <line x1="70" y1="38" x2="73" y2="38" stroke="#4a3826" stroke-width="1.2"/>
  <line x1="71" y1="46" x2="74" y2="46" stroke="#4a3826" stroke-width="1.2"/>
  <line x1="70" y1="54" x2="73" y2="54" stroke="#4a3826" stroke-width="1.2"/>
  <circle cx="66" cy="67" r="2.5" fill="#e74c3c"/>
  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#e0a878"/>
  <!-- Hair top swept to braid side -->
  <path d="M32 32 Q32 20 50 20 Q68 20 68 32 Q58 25 50 27 Q40 26 32 32 Z" fill="#241a12"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#e0a878"/>
  <circle cx="68" cy="36" r="2.5" fill="#e0a878"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Friendly smile -->
  <path d="M44 42 Q50 48 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: forest-green riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#15803d"/>
  <!-- Jacket zip + collar -->
  <line x1="50" y1="57" x2="50" y2="88" stroke="#14532d" stroke-width="1.5"/>
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#14532d" stroke-width="1.5"/>
  <!-- Mirror keychain on chest -->
  <circle cx="42" cy="66" r="2.5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="43" y1="63" x2="45" y2="60" stroke="#fbbf24" stroke-width="1"/>
</svg>
