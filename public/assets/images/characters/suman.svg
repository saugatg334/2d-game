<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Suman - youthful rider with teal jacket and shoulder strap -->

  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#eebe96"/>
  <!-- Side-parted dark hair -->
  <path d="M32 32 Q32 19 50 19 Q68 19 68 32 Q63 23 46 25 Q36 26 32 33 Z" fill="#171717"/>
  <!-- Part line -->
  <line x1="44" y1="20" x2="43" y2="27" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Ears -->
  <circle cx="32" cy="36" r="2.5" fill="#eebe96"/>
  <circle cx="68" cy="36" r="2.5" fill="#eebe96"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Cheerful open smile -->
  <path d="M43 42 Q50 49 57 42 Z" fill="#7a4a32"/>
  <!-- Body: teal casual jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#0d9488"/>
  <!-- Light inner shirt panel -->
  <rect x="45" y="55" width="10" height="12" fill="#f0fdfa"/>
  <path d="M45 67 Q50 71 55 67 L55 90 L45 90 Z" fill="#0d9488"/>
  <!-- Diagonal shoulder strap -->
  <path d="M39 57 L58 88 L52 90 L34 64 Z" fill="#134e4a"/>
  <!-- Jacket buttons -->
  <circle cx="57" cy="74" r="1.2" fill="#99f6e4"/>
  <circle cx="57" cy="82" r="1.2" fill="#99f6e4"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#134e4a" stroke-width="1.5"/>
</svg>
