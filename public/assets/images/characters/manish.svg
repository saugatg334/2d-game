<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Manish - rider in dark jacket with textured hair -->

  <!-- Head -->
  <circle cx="50" cy="35" r="19" fill="#d4a574"/>
  <!-- Short textured hair (jagged spikes) -->
  <path d="M31 31 L34 22 L39 27 L44 19 L50 25 L56 19 L61 27 L66 22 L69 31 Q60 25 50 26 Q40 25 31 31 Z" fill="#141414"/>
  <!-- Ears -->
  <circle cx="31" cy="36" r="3" fill="#d4a574"/>
  <circle cx="69" cy="36" r="3" fill="#d4a574"/>
  <!-- Eyes -->
  <circle cx="43" cy="33" r="3" fill="#2c3e50"/>
  <circle cx="57" cy="33" r="3" fill="#2c3e50"/>
  <!-- Confident smile -->
  <path d="M44 42 Q50 47 56 42" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <!-- Body: dark slate riding jacket -->
  <rect x="35" y="55" width="30" height="35" rx="5" fill="#334155"/>
  <!-- Asymmetric chest zip -->
  <path d="M50 57 L56 57 L56 88 L50 88 Z" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="53" cy="62" r="1.2" fill="#94a3b8"/>
  <!-- Shoulder reinforce panels -->
  <rect x="35" y="55" width="30" height="6" rx="2" fill="#1e293b"/>
  <!-- Gloves tucked at waist -->
  <ellipse cx="39" cy="78" rx="4" ry="3" fill="#0f172a"/>
  <ellipse cx="61" cy="78" rx="4" ry="3" fill="#0f172a"/>
  <!-- Collar -->
  <path d="M44 55 L50 59 L56 55" fill="none" stroke="#0f172a" stroke-width="1.5"/>
</svg>
